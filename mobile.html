        `;
      }

      function getMonthStart(isoDate) {
        const date = createLocalDate(isoDate);
        date.setDate(1);
        return toLocalIsoDate(date);
      }

      function getMonthGridDates(isoDate) {
        const start = createLocalDate(getMonthStart(isoDate));
        const gridStart = new Date(start);
        gridStart.setDate(start.getDate() - start.getDay());
        return Array.from({ length: 42 }, (_, index) => {
          const next = new Date(gridStart);
          next.setDate(gridStart.getDate() + index);
          return toLocalIsoDate(next);
        });
      }

      function formatMonthTitle(isoDate) {
        const date = createLocalDate(isoDate);
        return date.toLocaleDateString("zh-TW", { year: "numeric", month: "long" });
      }

      function getWeekdayLabel(isoDate) {
        const labels = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        return labels[createLocalDate(isoDate).getDay()] || "星期一";
      }

      function getNthWeekLabel(isoDate) {
        const day = createLocalDate(isoDate).getDate();
        if (day > 28) return "最後一週";
        const index = Math.floor((day - 1) / 7);
        return ["第一週", "第二週", "第三週", "第四週"][index] || "第一週";
      }

      function getMonthsDiff(startIsoDate, targetIsoDate) {
        const start = createLocalDate(startIsoDate);
        const target = createLocalDate(targetIsoDate);
        return (target.getFullYear() - start.getFullYear()) * 12 + (target.getMonth() - start.getMonth());
      }

      function buildRecurringRuleSummary(rule) {
        const repeatMode = rule.repeatMode || rule.frequency || "每月";
        const recurrenceType = rule.recurrenceType || rule.scheduleType || "fixed_date";
        const startDate = rule.startDate || TODAY;
        const startMonth = Number(startDate.slice(5, 7));
        const startDay = Number(startDate.slice(8, 10));
        const endText = rule.noEndRepeat || !rule.repeatEndDate ? "不結束" : `至 ${formatDateLabel(rule.repeatEndDate)}`;
        const interval = Number(rule.interval) || 1;
        const intervalText = interval > 1 ? `每 ${interval} ${repeatMode.replace("每", "")}` : repeatMode;

        if (repeatMode === "每天" || repeatMode === "每週") {
          const weekdayText = repeatMode === "每天" ? "" : ` · ${(rule.weekdays || [rule.weekday]).join("、")}`;
          return `${intervalText} · ${rule.startTime}-${rule.endTime}${weekdayText} · ${endText}`;
        }
        if (recurrenceType === "monthly_flexible") {
          return `${intervalText}待排一次 · ${rule.startTime}-${rule.endTime} · ${endText}`;
        }
        if (recurrenceType === "nth_weekday") {
          return `${intervalText} ${rule.nthWeek}${rule.weekday} · ${rule.startTime}-${rule.endTime} · ${endText}`;
        }
        if (repeatMode === "每年") {
          const monthText = (rule.months || [String(startMonth).padStart(2, "0")]).map((month) => `${Number(month)}月`).join("、");
          return `${intervalText} ${monthText} ${startDay}日 · ${rule.startTime}-${rule.endTime} · ${endText}`;
        }
        if (repeatMode === "每季") {
          return `${intervalText} ${startMonth}月起算 · ${startDay}日 · ${rule.startTime}-${rule.endTime} · ${endText}`;
        }
        return `${intervalText} ${(rule.monthDates || [startDay]).join("、")}日 · ${rule.startTime}-${rule.endTime} · ${endText}`;
      }

      function compareIsoMonth(left, right) {
        return left.localeCompare(right);
      }

      function daysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
      }

      function weekdayNumber(label) {
        return { "星期日": 0, "星期一": 1, "星期二": 2, "星期三": 3, "星期四": 4, "星期五": 5, "星期六": 6 }[label] ?? 1;
      }

      function nthWeekdayDate(year, month, nthWeek, weekdayLabel) {
        const weekday = weekdayNumber(weekdayLabel);
        const first = new Date(year, month - 1, 1);
        if (nthWeek === "最後一週") {
          const last = new Date(year, month, 0);
          const diff = (last.getDay() - weekday + 7) % 7;
          last.setDate(last.getDate() - diff);
          return toLocalIsoDate(last);
        }
        const nthMap = { "第一週": 1, "第二週": 2, "第三週": 3, "第四週": 4 };
        const targetNth = nthMap[nthWeek] || 1;
        const diff = (weekday - first.getDay() + 7) % 7;
        const date = 1 + diff + (targetNth - 1) * 7;
        return toLocalIsoDate(new Date(year, month - 1, Math.min(date, daysInMonth(year, month))));
      }

      function adjustHolidayDate(isoDate, action) {
        if (action === "不調整") return isoDate;
        let next = isoDate;
        while (isHolidayDate(next)) {
          next = addDays(next, action === "提前到前一工作日" ? -1 : 1);
        }
        return next;
      }

      function moveByWorkingDays(isoDate, offset) {
        let cursor = isoDate;
        let remaining = Math.abs(Number(offset) || 0);
        const direction = offset >= 0 ? 1 : -1;
        while (remaining > 0) {
          cursor = addDays(cursor, direction);
          if (!isHolidayDate(cursor)) {
            remaining -= 1;
          }
        }
        return cursor;
      }

      function buildRecurringOccurrence(rule, isoDate) {
        return {
          id: `recurring-${rule.id}-${isoDate}`,
          sourceRuleId: rule.id,
          title: (rule.recurrenceType || rule.scheduleType) === "monthly_flexible" ? `${rule.title}（待排）` : rule.title,
          date: isoDate,
          startTime: rule.startTime,
          endTime: rule.endTime,
          allDay: false,
          category: rule.category,
          priority: "中",
          reminder: rule.reminder || "不提醒",
          location: "",
          notes: rule.notes,
          generated: true
        };
      }

      function buildProcessOccurrence(rule, step, isoDate) {
        return {
          id: `process-${rule.id}-${step.id}-${isoDate}`,
          sourceProcessRuleId: rule.id,
          sourceProcessStepId: step.id,
          title: step.title,
          date: isoDate,
          startTime: step.startTime,
          endTime: step.endTime,
          allDay: false,
          category: rule.category,
          priority: step.relation === "main" ? "中" : "高",
          reminder: step.reminder || "不提醒",
          location: "",
          notes: step.notes || `${rule.title} · ${step.title}`,
          generated: true
        };
      }

      function buildProcessSkipKey(stepId, isoDate) {
        return `${stepId}@${isoDate}`;
      }

      function hasRecurringException(ruleId, isoDate, occurrenceTitle = "", occurrenceCategory = "") {
        const rule = (state.recurringRules || []).find((item) => String(item.id) === String(ruleId));
        const fallbackTitle = String(occurrenceTitle || rule?.title || "").trim();
        const fallbackCategory = resolveExistingCategory(
          occurrenceCategory || rule?.category || "",
          state.settings.categories
        );

        return state.events.some((item) => {
          if (item.date !== isoDate) return false;
          if (String(item.sourceRuleId || "") === String(ruleId)) return true;
          if (!rule || !(rule.skipDates || []).includes(isoDate)) return false;
          return (
            String(item.title || "").trim() === fallbackTitle &&
            resolveExistingCategory(item.category, state.settings.categories) === fallbackCategory
          );
        });
      }

      function hasProcessException(ruleId, stepId, isoDate, stepTitle = "", occurrenceCategory = "") {
        const rule = (state.processRules || []).find((item) => String(item.id) === String(ruleId));
        const fallbackTitle = String(stepTitle || "").trim();
        const fallbackCategory = resolveExistingCategory(
          occurrenceCategory || rule?.category || "",
          state.settings.categories
        );
        const skipKey = buildProcessSkipKey(stepId, isoDate);

        return state.events.some((item) => {
          if (item.date !== isoDate) return false;
          if (
            String(item.sourceProcessRuleId || "") === String(ruleId) &&
            (!item.sourceProcessStepId || String(item.sourceProcessStepId || "") === String(stepId))
          ) {
            return true;
          }
          if (!rule || !(rule.skipOccurrences || []).includes(skipKey)) return false;
          return (
            String(item.title || "").trim() === fallbackTitle &&
            resolveExistingCategory(item.category, state.settings.categories) === fallbackCategory
          );
        });
      }

      function isRecurringExceptionEvent(item) {
        if (!item) return false;
        if (item.sourceRuleId) return true;
        return (state.recurringRules || []).some((rule) =>
          (rule.skipDates || []).includes(item.date) &&
          rule.title === item.title &&
          resolveExistingCategory(rule.category, state.settings.categories) === resolveExistingCategory(item.category, state.settings.categories)
        );
      }

      function isProcessExceptionEvent(item) {
        if (!item) return false;
        if (item.sourceProcessRuleId || item.sourceProcessStepId) return true;
        return (state.processRules || []).some((rule) =>
          (rule.steps || []).some((step) =>
            (rule.skipOccurrences || []).includes(buildProcessSkipKey(step.id, item.date)) &&
            step.title === item.title &&
            resolveExistingCategory(rule.category, state.settings.categories) === resolveExistingCategory(item.category, state.settings.categories)
          )
        );
      }

      function isRecurringCandidateEvent(item) {
        const todayDate = getCurrentIsoDate();
        if (!item || item.date < todayDate || item.generated) return false;
        if (isRecurringExceptionEvent(item) || isProcessExceptionEvent(item)) return false;
        return true;
      }

      function getProcessStepDateMap(rule, year, month) {
        const day = Math.min(Number(rule.monthlyDay) || 1, daysInMonth(year, month));
        const rawMainDate = toLocalIsoDate(new Date(year, month - 1, day));
        if (rawMainDate < (normalizeDateInputValue(rule.startDate) || TODAY)) return null;
        const mainDate = adjustHolidayDate(rawMainDate, rule.holidayAction);
        const stepDateMap = { main: mainDate };
        rule.steps.forEach((step) => {
          const anchorDate = step.relation === "main"
            ? mainDate
            : (stepDateMap[step.anchorStepId || "main"] || mainDate);
          let stepDate = anchorDate;
          if (step.relation !== "main" && Number(step.offsetValue) > 0) {
            const directionMultiplier = step.offsetDirection === "延後" ? 1 : -1;
            stepDate = step.offsetUnit === "工作天"
              ? moveByWorkingDays(anchorDate, Number(step.offsetValue) * directionMultiplier)
              : addDays(anchorDate, Number(step.offsetValue) * directionMultiplier);
          }
          stepDateMap[step.id] = stepDate;
        });
        return stepDateMap;
      }

      function findProcessOccurrenceContext(rule, stepId, occurrenceDate) {
        const base = createLocalDate(occurrenceDate);
        const candidates = [
          new Date(base.getFullYear(), base.getMonth() - 1, 1),
          new Date(base.getFullYear(), base.getMonth(), 1),
          new Date(base.getFullYear(), base.getMonth() + 1, 1)
        ];
        for (const candidate of candidates) {
          const year = candidate.getFullYear();
          const month = candidate.getMonth() + 1;
          const stepDateMap = getProcessStepDateMap(rule, year, month);
          if (!stepDateMap) continue;
          if (stepDateMap[stepId] === occurrenceDate) {
            return { year, month, stepDateMap };
          }
        }
        return null;
      }

      function getWorkingDayDifference(anchorDate, targetDate) {
        if (anchorDate === targetDate) return 0;
        let cursor = anchorDate;
        let diff = 0;
        const direction = targetDate > anchorDate ? 1 : -1;
        while (cursor !== targetDate) {
          cursor = addDays(cursor, direction);
          if (!isHolidayDate(cursor)) diff += direction;
        }
        return diff;
      }

      function getRecurringOccurrences(rangeStart, rangeEnd) {
        const results = [];

        (state.recurringRules || []).forEach((rule) => {
          const repeatMode = rule.repeatMode || rule.frequency || "每月";
          const recurrenceType = rule.recurrenceType || rule.scheduleType || "fixed_date";
          const startDate = normalizeDateInputValue(rule.startDate) || TODAY;
          const interval = Number(rule.interval) || (repeatMode === "每兩週" ? 2 : 1);
          const normalizedRepeatEndDate = normalizeDateInputValue(rule.repeatEndDate);
          const endDateLimit = rule.noEndRepeat || !normalizedRepeatEndDate
            ? rangeEnd
            : (normalizedRepeatEndDate < rangeEnd ? normalizedRepeatEndDate : rangeEnd);

          if (endDateLimit < rangeStart || startDate > rangeEnd) return;

          if (repeatMode === "每天" || repeatMode === "每週") {
            if (repeatMode === "每天") {
              let cursor = startDate;
              while (cursor <= endDateLimit) {
                if (cursor >= rangeStart) {
                  const adjusted = adjustHolidayDate(cursor, rule.holidayAction);
                  if (!(rule.skipDates || []).includes(adjusted) && !hasRecurringException(rule.id, adjusted, rule.title, rule.category) && adjusted >= rangeStart && adjusted <= rangeEnd) {
                    results.push(buildRecurringOccurrence(rule, adjusted));
                  }
                }
                cursor = addDays(cursor, interval);
              }
            } else {
              let cursor = startDate;
              const weekdays = rule.weekdays || [getWeekdayLabel(startDate)];
              while (cursor <= endDateLimit) {
                const weekDiff = Math.floor((createLocalDate(cursor) - createLocalDate(startDate)) / (1000 * 60 * 60 * 24 * 7));
                if (weekDiff >= 0 && weekDiff % interval === 0 && weekdays.includes(getWeekdayLabel(cursor))) {
                  const adjusted = adjustHolidayDate(cursor, rule.holidayAction);
                  if (!(rule.skipDates || []).includes(adjusted) && !hasRecurringException(rule.id, adjusted, rule.title, rule.category) && adjusted >= rangeStart && adjusted <= rangeEnd) {
                    results.push(buildRecurringOccurrence(rule, adjusted));
                  }
                }
                cursor = addDays(cursor, 1);
              }
            }
            return;
          }

          let cursor = `${startDate.slice(0, 7)}`;
          const cursorEnd = `${endDateLimit.slice(0, 7)}`;
          while (compareIsoMonth(cursor, cursorEnd) <= 0) {
            const [year, month] = cursor.split("-").map(Number);
            const monthStartDate = `${year}-${String(month).padStart(2, "0")}-01`;
            const monthsDiff = getMonthsDiff(startDate, monthStartDate);
            const monthMatches = (
              (repeatMode === "每月" && monthsDiff >= 0 && monthsDiff % interval === 0)
              || (repeatMode === "每季" && monthsDiff >= 0 && monthsDiff % (3 * interval) === 0)
              || (repeatMode === "每年" && ((year - Number(startDate.slice(0, 4))) % interval === 0) && (rule.months || [startDate.slice(5, 7)]).includes(String(month).padStart(2, "0")))
            );

            if (monthMatches) {
              if (recurrenceType === "monthly_flexible") {
                const occurrenceDate = adjustHolidayDate(toLocalIsoDate(new Date(year, month - 1, 1)), rule.holidayAction);
                if (!(rule.skipDates || []).includes(occurrenceDate) && !hasRecurringException(rule.id, occurrenceDate, rule.title, rule.category) && occurrenceDate >= startDate && occurrenceDate >= rangeStart && occurrenceDate <= rangeEnd && occurrenceDate <= endDateLimit) {
                  results.push(buildRecurringOccurrence(rule, occurrenceDate));
                }
              } else if (recurrenceType === "nth_weekday") {
                const occurrenceDate = adjustHolidayDate(nthWeekdayDate(year, month, rule.nthWeek || getNthWeekLabel(startDate), rule.weekday || getWeekdayLabel(startDate)), rule.holidayAction);
                if (!(rule.skipDates || []).includes(occurrenceDate) && !hasRecurringException(rule.id, occurrenceDate, rule.title, rule.category) && occurrenceDate >= startDate && occurrenceDate >= rangeStart && occurrenceDate <= rangeEnd && occurrenceDate <= endDateLimit) {
                  results.push(buildRecurringOccurrence(rule, occurrenceDate));
                }
              } else {
                const monthDates = repeatMode === "每年"
                  ? [Number(startDate.slice(8, 10)) || 1]
                  : (rule.monthDates || [rule.monthDay || Number(startDate.slice(8, 10)) || 1]);
                monthDates.forEach((rawDay) => {
                  const day = Math.min(Number(rawDay) || 1, daysInMonth(year, month));
                  const occurrenceDate = adjustHolidayDate(toLocalIsoDate(new Date(year, month - 1, day)), rule.holidayAction);
                  if (!(rule.skipDates || []).includes(occurrenceDate) && !hasRecurringException(rule.id, occurrenceDate, rule.title, rule.category) && occurrenceDate >= startDate && occurrenceDate >= rangeStart && occurrenceDate <= rangeEnd && occurrenceDate <= endDateLimit) {
                    results.push(buildRecurringOccurrence(rule, occurrenceDate));
                  }
                });
              }
            }

            const next = new Date(year, month - 1, 1);
            next.setMonth(next.getMonth() + 1);
            cursor = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
          }
        });

        return results;
      }

      function getProcessOccurrences(rangeStart, rangeEnd) {
        const results = [];
        (state.processRules || []).forEach((rule) => {
          const startDate = normalizeDateInputValue(rule.startDate) || TODAY;
          const normalizedRepeatEndDate = normalizeDateInputValue(rule.repeatEndDate);
          const endDateLimit = rule.noEndRepeat || !normalizedRepeatEndDate
            ? rangeEnd
            : (normalizedRepeatEndDate < rangeEnd ? normalizedRepeatEndDate : rangeEnd);
          if (endDateLimit < rangeStart || startDate > rangeEnd) return;

          let cursor = `${startDate.slice(0, 7)}`;
          const cursorEnd = `${endDateLimit.slice(0, 7)}`;
          while (compareIsoMonth(cursor, cursorEnd) <= 0) {
            const [year, month] = cursor.split("-").map(Number);
            const day = Math.min(Number(rule.monthlyDay) || 1, daysInMonth(year, month));
            const rawMainDate = toLocalIsoDate(new Date(year, month - 1, day));
            if (rawMainDate >= startDate && rawMainDate <= endDateLimit) {
              const mainDate = adjustHolidayDate(rawMainDate, rule.holidayAction);
              const stepDateMap = { main: mainDate };
              rule.steps.forEach((step) => {
                const anchorDate = step.relation === "main"
                  ? mainDate
                  : (stepDateMap[step.anchorStepId || "main"] || mainDate);
                let stepDate = anchorDate;
                if (step.relation !== "main" && Number(step.offsetValue) > 0) {
                  const directionMultiplier = step.offsetDirection === "延後" ? 1 : -1;
                  stepDate = step.offsetUnit === "工作天"
                    ? moveByWorkingDays(anchorDate, Number(step.offsetValue) * directionMultiplier)
                    : addDays(anchorDate, Number(step.offsetValue) * directionMultiplier);
                }
                stepDateMap[step.id] = stepDate;
                const skipKey = buildProcessSkipKey(step.id, stepDate);
                if (
                  !(rule.skipOccurrences || []).includes(skipKey) &&
                  !hasProcessException(rule.id, step.id, stepDate, step.title, rule.category) &&
                  stepDate >= rangeStart &&
                  stepDate <= rangeEnd &&
                  stepDate <= endDateLimit
                ) {
                  results.push(buildProcessOccurrence(rule, step, stepDate));
                }
              });
            }

            const next = new Date(year, month - 1, 1);
            next.setMonth(next.getMonth() + 1);
            cursor = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}`;
          }
        });
        return results;
      }

      function getCalendarEvents(rangeStart = addDays(getCurrentIsoDate(), -370), rangeEnd = addDays(getCurrentIsoDate(), 740)) {
        const directEvents = state.events.filter((event) => {
          const endDate = event.endDate || event.date;
          return event.date <= rangeEnd && endDate >= rangeStart;
        });
        return [...directEvents, ...getRecurringOccurrences(rangeStart, rangeEnd), ...getProcessOccurrences(rangeStart, rangeEnd)];
      }

      function ruleOverlapsRange(rule, startDate, endDate) {
        if (!rule) return false;
        const ruleStart = normalizeDateInputValue(rule.startDate) || "";
        const ruleEnd = rule.noEndRepeat ? "" : (normalizeDateInputValue(rule.repeatEndDate) || "");
        if (!ruleStart) return false;
        if (ruleStart > endDate) return false;
        if (!ruleEnd) return true;
        return ruleEnd >= startDate;
      }

      function getEventsForDate(isoDate) {
        return sortEvents(
          getCalendarEvents(addDays(isoDate, -31), addDays(isoDate, 31)).filter((item) => item.date <= isoDate && (item.endDate || item.date) >= isoDate)
        );
      }

      function isMultiDayEvent(event) {
        return Boolean(event?.endDate && event.endDate > event.date);
      }

      function formatEventTime(event, displayDate = event?.date) {
        if (event.allDay) return isMultiDayEvent(event) ? `全天 · 至 ${formatDateLabel(event.endDate)}` : "全天";
        if (isMultiDayEvent(event)) {
          if (displayDate === event.date) return `${event.startTime || "--:--"} 起 · 跨日`;
          if (displayDate === event.endDate) return `跨日 · 至 ${event.endTime || "--:--"}`;
          return "跨日行程";
        }
        if (!event.startTime || !event.endTime) return "未指定時間";
        return `${event.startTime} - ${event.endTime}`;
      }

      function getEventOriginLabel(event) {
        if (event?.sourceProcessRuleId) {
          return event.generated ? "固定流程" : "固定流程例外";
        }
        if (event?.sourceRuleId) {
          return event.generated ? "固定行程" : "固定行程例外";
        }
        return "";
      }

      function buildEventMetaParts(event) {
        const seen = new Set();
        return [
          getEventOriginLabel(event),
          event.location,
          event.notes
        ]
          .map((item) => String(item || "").trim())
          .filter((item) => item && item !== String(event?.title || "").trim())
          .filter((item) => {
            if (seen.has(item)) return false;
            seen.add(item);
            return true;
          });
      }

      function buildEditOriginNotice(item) {
        if (!item?.sourceRuleId && !item?.sourceProcessRuleId) return "";
        if (item.generated && item.sourceRuleId) {
          return `
            <div class="origin-notice">
              <div>
                <strong>這筆來自固定行程</strong>
                <p>儲存時可以選擇只修改這一天，或更新之後的安排。</p>
              </div>
            </div>
          `;
        }
        if (item.generated && item.sourceProcessRuleId) {
          return `
            <div class="origin-notice">
              <div>
                <strong>這筆來自固定流程</strong>
                <p>儲存時可以選擇只修改這一天，或更新這個流程之後的安排。</p>
              </div>
            </div>
          `;
        }
        if (!item.generated && item.sourceRuleId) {
          return `
            <div class="origin-notice">
              <div>
                <strong>這筆是固定行程例外</strong>
                <p>目前正在編輯單次例外，不會直接改動原本的固定規則。</p>
              </div>
            </div>
          `;
        }
        if (!item.generated && item.sourceProcessRuleId) {
          return `
            <div class="origin-notice">
              <div>
                <strong>這筆是固定流程例外</strong>
                <p>目前正在編輯單次例外，不會直接改動原本的固定流程規則。</p>
              </div>
            </div>
          `;
        }
        return "";
      }

      function isPastEvent(event) {
        const todayDate = getCurrentIsoDate();
        const endDate = event.endDate || event.date;
        if (endDate < todayDate) return true;
        if (event.date > todayDate) return false;
        if (endDate > todayDate) return false;
        if (event.allDay || !event.endTime) return false;
        const currentTime = getCurrentIsoDateTime().slice(11, 16);
        return parseTimeValue(event.endTime) <= parseTimeValue(currentTime);
      }

      function sortEvents(items) {
        return [...items].sort((left, right) => {
          if (left.date && right.date && left.date !== right.date) {
            return left.date.localeCompare(right.date);
          }
          if (left.allDay && !right.allDay) return -1;
          if (!left.allDay && right.allDay) return 1;
          return parseTimeValue(left.startTime) - parseTimeValue(right.startTime);
        });
      }

      function timeRangeOverlaps(leftStart, leftEnd, rightStart, rightEnd) {
        return leftStart < rightEnd && rightStart < leftEnd;
      }

      function hasConflict(targetId, date, endDate, startTime, endTime, allDay) {
        return state.events.some((event) => {
          if (String(event.id) === String(targetId)) return false;
          const eventEndDate = event.endDate || event.date;
          if (event.date > endDate || eventEndDate < date) return false;
          if (allDay || event.allDay) return true;
          if (event.date !== date) return false;
          return timeRangeOverlaps(
            parseTimeValue(startTime),
            parseTimeValue(endTime),
            parseTimeValue(event.startTime),
            parseTimeValue(event.endTime)
          );
        });
      }

      function closeContextMenu() {
        if (contextMenu) {
          contextMenu.remove();
          contextMenu = null;
        }
      }

      function openContextMenu(x, y, kind, id) {
        closeContextMenu();
        const menu = document.createElement("div");
        menu.className = "context-menu";
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;

        const deleteButton = document.createElement("button");
        deleteButton.className = "context-item";
        deleteButton.textContent = "刪除";
        deleteButton.addEventListener("click", () => {
          captureUndoState();
          if (kind === "event") {
            const item = getEventById(id);
            if (item?.generated && item?.sourceRuleId) {
              state.recurringRules = state.recurringRules.map((rule) => (
                String(rule.id) === String(item.sourceRuleId)
                  ? { ...rule, skipDates: [...new Set([...(rule.skipDates || []), item.date])] }
                  : rule
              ));
            } else if (item?.generated && item?.sourceProcessRuleId && item?.sourceProcessStepId) {
              state.processRules = state.processRules.map((rule) => (
                String(rule.id) === String(item.sourceProcessRuleId)
                  ? {
                      ...rule,
                      skipOccurrences: [
                        ...new Set([...(rule.skipOccurrences || []), buildProcessSkipKey(item.sourceProcessStepId, item.date)])
                      ]
                    }
                  : rule
              ));
            } else {
              state.events = state.events.filter((eventItem) => String(eventItem.id) !== String(id));
            }
          }
          if (kind === "todo") state.todos = state.todos.filter((item) => String(item.id) !== String(id));
          if (kind === "completed-todo") state.completedTodos = state.completedTodos.filter((item) => String(item.id) !== String(id));
          if (kind === "recurring-rule") {
            state.recurringRules = state.recurringRules.filter((item) => String(item.id) !== String(id));
            if (activeOverlay === "recurring") {
              closeContextMenu();
              persist();
              openRecurringModal();
              return;
            }
          }
          if (kind === "process-rule") {
            state.processRules = state.processRules.filter((item) => String(item.id) !== String(id));
            if (activeOverlay === "recurring") {
              closeContextMenu();
              persist();
              openRecurringModal();
              return;
            }
          }
          closeContextMenu();
          persist();
          render();
        });

        const copyButton = document.createElement("button");
        copyButton.className = "context-item";
        copyButton.style.color = "var(--accent-strong)";
        copyButton.textContent = "複製";
        copyButton.addEventListener("click", () => {
          captureUndoState();
          if (kind === "event") {
            const item = getEventById(id);
            if (item) {
              const duplicate = {
                ...item,
                id: generateId(),
                title: item.title,
                generated: false,
                sourceRuleId: "",
                sourceProcessRuleId: "",
                sourceProcessStepId: ""
              };
              state.events = [duplicate, ...state.events];
              persist();
              closeContextMenu();
              openModal("event", { id: duplicate.id, item: duplicate }, activeOverlay);
              return;
            }
          }
          if (kind === "todo" || kind === "completed-todo") {
            const item = getTodoById(id);
            if (item) {
              const duplicate = {
                ...item,
                id: generateId(),
                title: item.title,
                completedDate: undefined,
                completedAt: undefined
              };
              state.todos = [duplicate, ...state.todos];
              persist();
              closeContextMenu();
              openModal("todo", { id: duplicate.id, item: duplicate }, activeOverlay);
              return;
            }
          }
          if (kind === "recurring-rule") {
            const item = (state.recurringRules || []).find((rule) => String(rule.id) === String(id));
            if (item) {
              const duplicate = duplicateRecurringRule(item);
              state.recurringRules = [duplicate, ...state.recurringRules];
              persist();
              closeContextMenu();
              openRecurringRuleModal({ rule: duplicate });
              return;
            }
          }
          if (kind === "process-rule") {
            const item = (state.processRules || []).find((rule) => String(rule.id) === String(id));
            if (item) {
              const duplicate = duplicateProcessRule(item);
              state.processRules = [duplicate, ...state.processRules];
              persist();
              closeContextMenu();
              openProcessRuleModal({ rule: duplicate });
              return;
            }
          }
          closeContextMenu();
          persist();
          render();
        });

        menu.appendChild(copyButton);
        menu.appendChild(deleteButton);
        document.body.appendChild(menu);
        contextMenu = menu;
      }

      function getAvailableEndTimes(startTime) {
        return TIME_OPTIONS.filter((value) => parseTimeValue(value) > parseTimeValue(startTime));

      function getPickerConstraintMinutes(pickerType) {
        if (pickerType !== "end") return null;
        const modalStart = document.getElementById("modalStart");
        if (!(modalStart instanceof HTMLInputElement)) return null;
        return parseTimeValue(modalStart.value || "00:00");
      }

      function hasValidHourOption(pickerType, period, hour) {
        if (pickerType !== "end") return true;
        const limit = getPickerConstraintMinutes(pickerType);
        if (limit === null) return true;
        return TIME_MINUTE_OPTIONS.some((minute) => {
          const candidate = joinTimeParts(period, hour, minute);
          return parseTimeValue(candidate) > limit;
        });
      }

      function hasValidPeriodOption(pickerType, period) {
        if (pickerType !== "end") return true;
        return Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0")).some((hour) =>
          hasValidHourOption(pickerType, period, hour)
        );
      }

      function isMinuteDisabled(pickerType, period, hour, minute) {
        if (pickerType !== "end") return false;
        const limit = getPickerConstraintMinutes(pickerType);
        if (limit === null) return false;
        const candidate = joinTimeParts(period, hour, minute);
        return parseTimeValue(candidate) <= limit;
      }

      function normalizePickerParts(pickerType, parts) {
        if (hasValidHourOption(pickerType, parts.period, parts.hour) && !isMinuteDisabled(pickerType, parts.period, parts.hour, parts.minute)) {
          return parts;
        }

        const periods = [parts.period, ...(parts.period === "上午" ? ["下午"] : ["上午"])];
        const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
        const minutes = TIME_MINUTE_OPTIONS;

        for (const period of periods) {
          if (!hasValidPeriodOption(pickerType, period)) continue;
          for (const hour of hours) {
            if (!hasValidHourOption(pickerType, period, hour)) continue;
            for (const minute of minutes) {
              if (!isMinuteDisabled(pickerType, period, hour, minute)) {
                return { period, hour, minute };
              }
            }
          }
        }

        return parts;
      }

                        <select id="recurringCustomFrequency">

                          <option ${customFrequency === "每週" ? "selected" : ""}>每週</option>

                          <option value="monthly_flexible" ${(customFrequency === "每月" || customFrequency === "每季") && recurrenceType === "monthly_flexible" ? "selected" : ""}>待排一次</option>

                  <div id="recurringNthPatternWrap" class="rule-sheet ${(customFrequency === "每月" || customFrequency === "每季" || customFrequency === "每年") && recurrenceType === "nth_weekday" ? "" : "hidden"}">
                    <p class="rule-sheet-title">第幾週星期幾</p>
                    <div class="field-grid">
                      <label class="field">
                        <span>第幾週</span>
                        <select id="recurringNthWeekSelect">
                          ${["第一週","第二週","第三週","第四週","最後一週"].map((label) => `<option ${label === (existingRule?.nthWeek || getNthWeekLabel(startDate)) ? "selected" : ""}>${label}</option>`).join("")}

        syncWidgetLayer();

        document.getElementById("modalBackdrop").addEventListener("click", closeOverlayModal);

          if (!existingRule) return;
          const shouldDelete = window.confirm(`確定要刪除固定行程「${existingRule.title}」嗎？`);
          if (!shouldDelete) return;
          captureUndoState();
          state.recurringRules = state.recurringRules.filter((item) => String(item.id) !== String(existingRule.id));
          persist();
          openRecurringModal();
        });

        const recurringRepeatChoice = document.getElementById("recurringRepeatChoice");
        const recurringCustomWrap = document.getElementById("recurringCustomWrap");
        const recurringCustomFrequency = document.getElementById("recurringCustomFrequency");
        const recurringPatternWrap = document.getElementById("recurringPatternWrap");
        const recurringPatternType = document.getElementById("recurringPatternType");
        const recurringNthPatternWrap = document.getElementById("recurringNthPatternWrap");
        const recurringNthWeekSelect = document.getElementById("recurringNthWeekSelect");
        const recurringWeekdaySelect = document.getElementById("recurringWeekdaySelect");
        const recurringWeekdayWrap = document.getElementById("recurringWeekdayWrap");
        const recurringMonthDatesWrap = document.getElementById("recurringMonthDatesWrap");
        const recurringYearMonthsWrap = document.getElementById("recurringYearMonthsWrap");
        const recurringEndMode = document.getElementById("recurringEndMode");
        const recurringEndDateWrap = document.getElementById("recurringEndDateWrap");
        const recurringReadonlyRuleInfo = document.getElementById("recurringReadonlyRuleInfo");
        const recurringLiveSummary = document.getElementById("recurringLiveSummary");
        const recurringStartDate = document.getElementById("recurringStartDate");
        const recurringReadonlyWeekday = document.getElementById("recurringReadonlyWeekday");
        const recurringReadonlyNthWeek = document.getElementById("recurringReadonlyNthWeek");
        const recurringInterval = document.getElementById("recurringInterval");
        const recurringIntervalLabel = document.getElementById("recurringIntervalLabel");
        const recurringStartTimeInput = document.getElementById("recurringStartTime");
        const recurringEndTimeInput = document.getElementById("recurringEndTime");
        const recurringStartTrigger = document.getElementById("recurringStartTrigger");
        const recurringEndTrigger = document.getElementById("recurringEndTrigger");
        const recurringStartPopup = document.getElementById("recurringStartPopup");
        const recurringEndPopup = document.getElementById("recurringEndPopup");
        const recurringPanel = document.getElementById("modalPanel");
        wireDatePickerField(
          document.getElementById("recurringStartDate"),
          document.getElementById("recurringStartDatePicker")
        );
        wireDatePickerField(
          document.getElementById("recurringRepeatEndDate"),
          document.getElementById("recurringRepeatEndDatePicker")
        );

        function syncRecurringDateHints() {
          const anchorDate = normalizeDateInputValue(recurringStartDate.value) || TODAY;
          recurringReadonlyWeekday.textContent = `對應星期：${getWeekdayLabel(anchorDate)}`;
          recurringReadonlyNthWeek.textContent = `月內位置：${getNthWeekLabel(anchorDate)}`;
        }

        function syncRecurringRuleFields() {
          const choice = recurringRepeatChoice.value;
          const customMode = choice === "自訂";
          const effectiveRepeat = customMode ? recurringCustomFrequency.value : choice;
          const unitText = effectiveRepeat === "每天"
            ? "天"
            : effectiveRepeat === "每週"
              ? "週"
              : effectiveRepeat === "每月"
                ? "個月"
                : effectiveRepeat === "每季"
                  ? "季"
                  : "年";
          recurringCustomWrap.classList.toggle("hidden", !customMode);
          recurringReadonlyRuleInfo.classList.toggle("hidden", !(effectiveRepeat === "每月" || effectiveRepeat === "每年"));
          recurringPatternWrap.classList.toggle("hidden", !(customMode && (effectiveRepeat === "每月" || effectiveRepeat === "每季" || effectiveRepeat === "每年")));
          recurringNthPatternWrap.classList.toggle("hidden", !(customMode && (effectiveRepeat === "每月" || effectiveRepeat === "每季" || effectiveRepeat === "每年") && recurringPatternType.value === "nth_weekday"));
          recurringWeekdayWrap.classList.toggle("hidden", !(customMode && effectiveRepeat === "每週"));
          recurringMonthDatesWrap.classList.toggle("hidden", !(customMode && (effectiveRepeat === "每月" || effectiveRepeat === "每季") && recurringPatternType.value === "fixed_date"));
          recurringYearMonthsWrap.classList.toggle("hidden", !(customMode && effectiveRepeat === "每年"));
          recurringEndDateWrap.classList.toggle("hidden", recurringEndMode.value !== "指定日期");
          recurringIntervalLabel.textContent = `每隔幾${unitText}`;
          refreshRecurringLiveSummary();
        }

        function buildRecurringDraftSummary() {
          const startDateValue = normalizeDateInputValue(recurringStartDate.value) || TODAY;
          const repeatChoiceValue = recurringRepeatChoice.value;
          const customMode = repeatChoiceValue === "自訂";
          const effectiveRepeat = customMode ? recurringCustomFrequency.value : repeatChoiceValue;
          const nextRecurrenceType = (effectiveRepeat === "每月" || effectiveRepeat === "每季" || effectiveRepeat === "每年")
            ? recurringPatternType.value
            : (effectiveRepeat === "每年" ? "fixed_date" : "interval");
          const selectedWeekdays = Array.from(document.querySelectorAll("[data-weekday].active")).map((button) => button.getAttribute("data-weekday")).filter(Boolean);
          const selectedMonthDates = Array.from(document.querySelectorAll("[data-month-date].active")).map((button) => Number(button.getAttribute("data-month-date"))).filter(Boolean);
          const selectedYearMonths = Array.from(document.querySelectorAll("[data-year-month].active")).map((button) => button.getAttribute("data-year-month")).filter(Boolean);
          const nextRepeatEndDate = recurringEndMode.value === "指定日期"
            ? normalizeDateInputValue(document.getElementById("recurringRepeatEndDate").value)
            : "";
          const resolvedWeekdays = customMode && selectedWeekdays.length ? selectedWeekdays : [getWeekdayLabel(startDateValue)];
          const resolvedMonthDates = customMode && selectedMonthDates.length ? selectedMonthDates : [Number(startDateValue.slice(8, 10)) || 1];
          const resolvedYearMonths = customMode && selectedYearMonths.length ? selectedYearMonths : [startDateValue.slice(5, 7)];
          const resolvedNthWeek = customMode && nextRecurrenceType === "nth_weekday" ? recurringNthWeekSelect.value : getNthWeekLabel(startDateValue);
          const resolvedWeekday = customMode && nextRecurrenceType === "nth_weekday" ? recurringWeekdaySelect.value : getWeekdayLabel(startDateValue);

          return buildRecurringRuleSummary({
            repeatMode: effectiveRepeat,
            recurrenceType: nextRecurrenceType,
            frequency: effectiveRepeat,
            scheduleType: nextRecurrenceType,
            interval: Number(recurringInterval.value) || 1,
            weekdays: resolvedWeekdays,
            monthDates: resolvedMonthDates,
            months: resolvedYearMonths,
            startDate: startDateValue,
            repeatEndDate: nextRepeatEndDate,
            noEndRepeat: recurringEndMode.value !== "指定日期",
            startTime: recurringStartTimeInput.value || "10:00",
            endTime: recurringEndTimeInput.value || "11:00",
            nthWeek: resolvedNthWeek,
            weekday: resolvedWeekday
          });
        }

        function refreshRecurringLiveSummary() {
          if (!recurringLiveSummary) return;
          recurringLiveSummary.textContent = buildRecurringDraftSummary();
        }

        function recurringHasValidHour(period, hour) {
          return TIME_MINUTE_OPTIONS.some((minute) => {
            const candidate = joinTimeParts(period, hour, minute);
            return parseTimeValue(candidate) > parseTimeValue(recurringStartTimeInput.value || "10:00");
          });
        }

        function recurringMinuteDisabled(period, hour, minute) {
          const candidate = joinTimeParts(period, hour, minute);
          return parseTimeValue(candidate) <= parseTimeValue(recurringStartTimeInput.value || "10:00");
        }

        function normalizeRecurringPickerParts(pickerType, parts) {
          if (pickerType !== "end") return parts;
          if (recurringHasValidHour(parts.period, parts.hour) && !recurringMinuteDisabled(parts.period, parts.hour, parts.minute)) return parts;
          const periods = [parts.period, ...(parts.period === "上午" ? ["下午"] : ["上午"])];
          const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
          const minutes = TIME_MINUTE_OPTIONS;
          for (const period of periods) {
            for (const hour of hours) {
              if (!recurringHasValidHour(period, hour)) continue;
              for (const minute of minutes) {
                if (!recurringMinuteDisabled(period, hour, minute)) return { period, hour, minute };
              }
            }
          }
          return parts;
        }

        function closeRecurringTimePopups() {
          recurringStartPopup.classList.add("hidden");
          recurringEndPopup.classList.add("hidden");
        }

        function refreshRecurringEndTime() {
          const available = getAvailableEndTimes(recurringStartTimeInput.value || "10:00");
          if (!recurringEndTimeInput.value || parseTimeValue(recurringEndTimeInput.value) <= parseTimeValue(recurringStartTimeInput.value || "10:00")) {
            recurringEndTimeInput.value = available[0] || minutesToTime(parseTimeValue(recurringStartTimeInput.value || "10:00") + 1);
          }
          setTimeTriggerValue(recurringEndTrigger, recurringEndTimeInput.value);
        }

        function renderRecurringTimePopup(pickerType) {
          const input = pickerType === "start" ? recurringStartTimeInput : recurringEndTimeInput;
          const popup = pickerType === "start" ? recurringStartPopup : recurringEndPopup;
          const parts = splitTimeParts(input.value || (pickerType === "start" ? "10:00" : "11:00"));
          const periods = ["上午", "下午"];
          const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
          const minutes = TIME_MINUTE_OPTIONS;
          popup.innerHTML = `
            <div class="time-column">
              ${periods.map((period) => `<button class="time-option ${parts.period === period ? "active" : ""}" data-recurring-picker="${pickerType}" data-part="period" data-value="${period}" type="button">${period}</button>`).join("")}
            </div>
            <div class="time-column">
              ${hours.map((hour) => `<button class="time-option ${parts.hour === hour ? "active" : ""}" data-recurring-picker="${pickerType}" data-part="hour" data-value="${hour}" type="button" ${pickerType === "end" && !recurringHasValidHour(parts.period, hour) ? "disabled" : ""}>${hour}</button>`).join("")}
            </div>
            <div class="time-column">
              ${minutes.map((minute) => `<button class="time-option ${parts.minute === minute ? "active" : ""}" data-recurring-picker="${pickerType}" data-part="minute" data-value="${minute}" type="button" ${pickerType === "end" && recurringMinuteDisabled(parts.period, parts.hour, minute) ? "disabled" : ""}>${minute}</button>`).join("")}
            </div>
          `;
        }

        recurringRepeatChoice.addEventListener("change", syncRecurringRuleFields);
        recurringCustomFrequency.addEventListener("change", syncRecurringRuleFields);
        recurringEndMode.addEventListener("change", syncRecurringRuleFields);
        recurringPatternType.addEventListener("change", syncRecurringRuleFields);
        recurringStartDate.addEventListener("change", syncRecurringDateHints);
        recurringStartDate.addEventListener("input", syncRecurringDateHints);
        recurringInterval.addEventListener("input", () => {
          if (Number(recurringInterval.value) < 1) recurringInterval.value = 1;
          refreshRecurringLiveSummary();
        });
        syncRecurringDateHints();
        syncRecurringRuleFields();
        refreshRecurringEndTime();
        refreshRecurringLiveSummary();
        recurringPanel.tabIndex = -1;
        recurringPanel.focus();

        let recurringEscapeHandler = null;
        const closeRecurringComposer = () => {
          if (recurringEscapeHandler) {
            document.removeEventListener("keydown", recurringEscapeHandler);
            recurringEscapeHandler = null;
          }
          closeModal();
          openRecurringModal();
        };

        document.getElementById("modalBackdrop").addEventListener("click", closeRecurringComposer);
        document.getElementById("closeModalButton").addEventListener("click", closeRecurringComposer);
        recurringPanel.addEventListener("click", (event) => event.stopPropagation());

        recurringNthWeekSelect.addEventListener("change", refreshRecurringLiveSummary);
        recurringWeekdaySelect.addEventListener("change", refreshRecurringLiveSummary);
        document.getElementById("recurringRepeatEndDate").addEventListener("change", refreshRecurringLiveSummary);
        document.querySelectorAll("[data-weekday], [data-month-date], [data-year-month]").forEach((button) => {
          button.addEventListener("click", () => {
            button.classList.toggle("active");
            refreshRecurringLiveSummary();
          });
        });

        function openRecurringTimePopup(pickerType) {
          const popup = pickerType === "start" ? recurringStartPopup : recurringEndPopup;
          const hidden = popup.classList.contains("hidden");
          closeRecurringTimePopups();
          if (hidden) {
            renderRecurringTimePopup(pickerType);
            popup.classList.remove("hidden");
          }
        }

        bindTimeDisplayInput(recurringStartTrigger, recurringStartTimeInput, {
          openPopup: () => openRecurringTimePopup("start"),
          onValidChange: () => {
            refreshRecurringEndTime();
            refreshRecurringLiveSummary();
            if (!recurringEndPopup.classList.contains("hidden")) {
              renderRecurringTimePopup("end");
            }
          }
        });
        bindTimeDisplayInput(recurringEndTrigger, recurringEndTimeInput, {
          openPopup: () => openRecurringTimePopup("end"),
          onValidChange: refreshRecurringLiveSummary
        });

          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const option = target.closest("[data-recurring-picker]");
          if (option) {
            const pickerType = option.dataset.recurringPicker;
            const part = option.dataset.part;
            const value = option.dataset.value;
            if (!pickerType || !part || !value) return;
            const input = pickerType === "start" ? recurringStartTimeInput : recurringEndTimeInput;
            const trigger = pickerType === "start" ? recurringStartTrigger : recurringEndTrigger;
            const parts = splitTimeParts(input.value || (pickerType === "start" ? "10:00" : "11:00"));
            parts[part] = value;
            const safeParts = normalizeRecurringPickerParts(pickerType, parts);
            input.value = joinTimeParts(safeParts.period, safeParts.hour, safeParts.minute);
            setTimeTriggerValue(trigger, input.value);
            if (pickerType === "start") {
              refreshRecurringEndTime();
              renderRecurringTimePopup("end");
            }
            renderRecurringTimePopup(pickerType);
            refreshRecurringLiveSummary();
            if (part === "minute") closeRecurringTimePopups();
            return;

          if (normalizedRecurringStartTime) recurringStartTimeInput.value = normalizedRecurringStartTime;
          if (normalizedRecurringEndTime) recurringEndTimeInput.value = normalizedRecurringEndTime;
          const title = document.getElementById("recurringTitle").value.trim();
          const category = document.getElementById("recurringCategory").value;
          const nextStartDate = normalizeDateInputValue(recurringStartDate.value);
          const repeatChoiceValue = recurringRepeatChoice.value;
          const customMode = repeatChoiceValue === "自訂";
          const effectiveRepeat = customMode ? recurringCustomFrequency.value : repeatChoiceValue;
          const nextRecurrenceType = (effectiveRepeat === "每月" || effectiveRepeat === "每季" || effectiveRepeat === "每年")
            ? recurringPatternType.value
            : (effectiveRepeat === "每年" ? "fixed_date" : "interval");
          const nextRepeatEndDate = recurringEndMode.value === "指定日期"
            ? normalizeDateInputValue(document.getElementById("recurringRepeatEndDate").value)
            : "";
          const nextNoEndRepeat = recurringEndMode.value !== "指定日期";
          const nextStartTime = recurringStartTimeInput.value || "10:00";
          const nextEndTime = recurringEndTimeInput.value || "11:00";
          const nextHolidayAction = document.getElementById("recurringHolidayAction").value;
          const nextReminder = document.getElementById("recurringReminder").value;
          const notes = document.getElementById("recurringNotes").value.trim();
          const selectedWeekdays = Array.from(document.querySelectorAll("[data-weekday].active")).map((button) => button.getAttribute("data-weekday"));
          const selectedMonthDates = Array.from(document.querySelectorAll("[data-month-date].active")).map((button) => Number(button.getAttribute("data-month-date")));
          const selectedYearMonths = Array.from(document.querySelectorAll("[data-year-month].active")).map((button) => button.getAttribute("data-year-month"));

          if (!title || !nextStartDate) {
            window.alert("請先填寫標題與正確的開始日期，格式為 YYYY/MM/DD。");
            return;
          }
          if (parseTimeValue(nextEndTime) <= parseTimeValue(nextStartTime)) {
            window.alert("結束時間需要晚於開始時間。");
            return;
          }

          const resolvedWeekdays = customMode && selectedWeekdays.length ? selectedWeekdays : [getWeekdayLabel(nextStartDate)];
          const resolvedMonthDates = customMode && selectedMonthDates.length ? selectedMonthDates : [Number(nextStartDate.slice(8, 10)) || 1];
          const resolvedYearMonths = customMode && selectedYearMonths.length ? selectedYearMonths : [nextStartDate.slice(5, 7)];
          const resolvedNthWeek = customMode && nextRecurrenceType === "nth_weekday" ? recurringNthWeekSelect.value : getNthWeekLabel(nextStartDate);
          const resolvedWeekday = customMode && nextRecurrenceType === "nth_weekday" ? recurringWeekdaySelect.value : getWeekdayLabel(nextStartDate);
          captureUndoState();

          const nextRule = {
            id: existingRule?.id || generateId(),
            title,
            repeatMode: effectiveRepeat,
            recurrenceType: nextRecurrenceType,
            interval: Number(recurringInterval.value) || 1,
            weekdays: resolvedWeekdays,
            monthDates: resolvedMonthDates,
            months: resolvedYearMonths,
            startDate: nextStartDate,
            repeatEndDate: nextRepeatEndDate,
            noEndRepeat: nextNoEndRepeat,
            frequency: effectiveRepeat,
            scheduleType: nextRecurrenceType,
            anchorMonth: nextStartDate.slice(5, 7),
            monthDay: Number(nextStartDate.slice(8, 10)) || 1,
            nthWeek: resolvedNthWeek,
            weekday: resolvedWeekday,
            yearlyStart: nextStartDate.slice(0, 7),
            yearlyEnd: nextRepeatEndDate ? nextRepeatEndDate.slice(0, 7) : "",
            skipDates: existingRule?.skipDates || [],
            startTime: nextStartTime,
            endTime: nextEndTime,
            holidayAction: nextHolidayAction,
            reminder: nextReminder,
            category,
            notes
          };

          if (existingRule) {
            state.recurringRules = state.recurringRules.map((item) => (item.id === existingRule.id ? nextRule : item));
          } else {
            state.recurringRules.unshift(nextRule);

          closeModal();
          render();
          openRecurringModal();
        });

        `;

        document.getElementById("summaryWidgetCloseButton").addEventListener("click", closeSummaryWidget);

          summaryPinned = !summaryPinned;
          persistSummaryWidget();
          openDailySummaryModal();
        });
        const reminder = document.getElementById("floatingReminder");
        const header = document.getElementById("floatingReminderHeader");
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let isDraggingReminder = false;

        function handleReminderMove(event) {
          if (!isDraggingReminder) return;
          summaryWidgetPosition = {
            x: Math.max(12, Math.min(window.innerWidth - reminder.offsetWidth - 12, event.clientX - dragOffsetX)),
            y: Math.max(12, Math.min(window.innerHeight - reminder.offsetHeight - 12, event.clientY - dragOffsetY))
          };
          reminder.style.left = `${summaryWidgetPosition.x}px`;
          reminder.style.top = `${summaryWidgetPosition.y}px`;
        }

        function stopReminderDrag() {
          isDraggingReminder = false;
          reminder.classList.remove("dragging");
          const snapPadding = 18;
          if (summaryWidgetPosition.x < 42) {
            summaryWidgetPosition.x = snapPadding;
          } else if (summaryWidgetPosition.x + reminder.offsetWidth > window.innerWidth - 42) {
            summaryWidgetPosition.x = window.innerWidth - reminder.offsetWidth - snapPadding;
          }
          reminder.style.left = `${summaryWidgetPosition.x}px`;
          reminder.style.top = `${summaryWidgetPosition.y}px`;
          persistSummaryWidget();
          document.removeEventListener("pointermove", handleReminderMove);
          document.removeEventListener("pointerup", stopReminderDrag);
        }

        header.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          isDraggingReminder = true;
          dragOffsetX = event.clientX - reminder.offsetLeft;
          dragOffsetY = event.clientY - reminder.offsetTop;
          reminder.classList.add("dragging");
          document.addEventListener("pointermove", handleReminderMove);
          document.addEventListener("pointerup", stopReminderDrag);
        });

        function scheduleSummaryFade() {
          if (summaryPinned) return;
          clearTimeout(summaryFadeTimer);
          summaryFadeTimer = setTimeout(() => {
            reminder.classList.add("dimmed");
          }, 2600);
        }

        reminder.addEventListener("mouseenter", () => {
          clearTimeout(summaryFadeTimer);
          reminder.classList.remove("dimmed");
        });
        reminder.addEventListener("mouseleave", scheduleSummaryFade);

        reminder.classList.remove("dimmed");
        scheduleSummaryFade();
      }

          try {
            const session = await window.plannerCloudAuth.session();

            cloudLogout.classList.toggle("hidden", !session);

            cloudStatus.textContent = "無法讀取登入狀態，請稍後再試。";
          }
        }
        async function submitCloudAccount(register) {
          const auth = window.plannerCloudAuth;
          const email = document.getElementById("cloudAccountEmail").value.trim();
          const passwordField = document.getElementById("cloudAccountPassword");
          if (!auth || !email || !passwordField.value) {
            cloudStatus.textContent = "請輸入電子郵件和密碼。";
            return;
          }
          const buttons = [document.getElementById("cloudAccountLogin"), document.getElementById("cloudAccountRegister")];
          buttons.forEach((button) => { button.disabled = true; });
          cloudStatus.textContent = register ? "正在建立帳號..." : "正在登入...";
          try {
            const result = register ? await auth.signUp(email, passwordField.value) : await auth.signIn(email, passwordField.value);
            passwordField.value = "";
            if (register && !result.session) cloudStatus.textContent = "請先到信箱完成驗證，再回來登入。";
            else await refreshCloudAccount();
          } catch (_error) {
            cloudStatus.textContent = register ? "建立帳號失敗，請確認信箱和密碼後重試。" : "登入失敗，請確認帳號密碼或網路連線。";
          } finally {
            buttons.forEach((button) => { button.disabled = false; });
          }

          try {

            if (IS_MOBILE_VIEW) {
              const session = await window.plannerCloudAuth.session();
              if (session?.user?.id && !localStorage.getItem(`planner-cloud-baseline:${session.user.id}`)) {
                allowFirstDownload = window.confirm("第一次同步會合併手機與雲端的行程和待辦；若同一筆資料不同則會停止，避免覆蓋。確定繼續嗎？");
                if (!allowFirstDownload) return;

            }
            const result = await window.syncPlannerCloud({
              readLocal: () => state,
              allowFirstDownload,
              applyLocal: (nextState) => {
                captureUndoState();
                replaceState(normalizeState(nextState));
                render();
              }
            });
            cloudSyncBlocked = false;
            setCloudSyncStatus("雲端同步完成");
            cloudStatus.textContent = result === "uploaded" ? "已上傳行事曆資料。" : result === "downloaded" ? "已載入雲端行事曆資料。" : "雲端資料已是最新。";

            setCloudSyncStatus(error?.name === "SyncConflictError" ? "雲端與本機有不同修改，已暫停同步。請先保留備份。" : "雲端未同步，請檢查網路連線。");

              : "同步失敗，請檢查網路連線與帳號狀態。";

            cloudSyncRunning = false;
            cloudSyncButton.disabled = false;

        publishMobileWebButton?.addEventListener("click", async () => {

            cloudStatus.textContent = "請先同步雲端資料，再發布手機頁面。";

        document.querySelectorAll("[data-theme]").forEach((button) => {

        const getSelectedPurgeTargets = () => ({

          completed: Boolean(document.getElementById("purgeTodosToggle")?.checked)
        });
        document.getElementById("purgeAllButton").addEventListener("click", () => {
          const targets = getSelectedPurgeTargets();
          if (!targets.events && !targets.todos && !targets.completed) {
            window.alert("請先選擇至少一種要清除的類別。");
            return;
          }
          const targetLabels = [
            targets.events ? "行程（含固定/流程產生項目）" : "",
            targets.todos ? "待辦事項（含已完成）" : ""
          ].filter(Boolean).join("、");
          if (!window.confirm(`確定要清除所有${targetLabels}嗎？這個動作無法復原。`)) return;
          captureUndoState();
          if (targets.events) {
            state.events = [];
            state.recurringRules = state.recurringRules.map((rule) => {
              const occurrences = getRecurringOccurrences("1900-01-01", "9999-12-31")
                .filter((item) => String(item.sourceRuleId) === String(rule.id))
                .map((item) => item.date);
              return { ...rule, skipDates: [...new Set([...(rule.skipDates || []), ...occurrences])] };
            });
            state.processRules = state.processRules.map((rule) => {
              const skipKeys = getProcessOccurrences("1900-01-01", "9999-12-31")
                .filter((item) => String(item.sourceProcessRuleId) === String(rule.id))
                .map((item) => buildProcessSkipKey(item.sourceProcessStepId, item.date));
              return { ...rule, skipOccurrences: [...new Set([...(rule.skipOccurrences || []), ...skipKeys])] };
            });
          }
          if (targets.todos) state.todos = [];
          if (targets.completed) state.completedTodos = [];
          persist();
          closeModal();
          render();

        document.getElementById("purgeRangeButton").addEventListener("click", () => {
          const targets = getSelectedPurgeTargets();
          if (!targets.events && !targets.todos && !targets.completed) {
            window.alert("請先選擇至少一種要清除的類別。");
            return;
          }
          const startDate = normalizeDateInputValue(document.getElementById("settingsPurgeStartDate")?.value);
          const endDate = normalizeDateInputValue(document.getElementById("settingsPurgeEndDate")?.value);
          if (!startDate || !endDate) {
            window.alert("請先輸入正確的起始日期與結束日期，格式為 YYYY/MM/DD。");
            return;
          }
          if (endDate < startDate) {
            window.alert("結束日期不能早於起始日期。");
            return;
          }
          const targetLabels = [
            targets.events ? "行程（含固定/流程產生項目）" : "",
            targets.todos ? "待辦事項（含已完成）" : ""
          ].filter(Boolean).join("、");
          if (!window.confirm(`確定要清除 ${startDate} 到 ${endDate} 間的${targetLabels}嗎？`)) return;
          captureUndoState();
          if (targets.events) {
            state.events = state.events.filter((item) => !item.date || item.date < startDate || item.date > endDate);
            const recurringOccurrences = getRecurringOccurrences(startDate, endDate);
            const recurringSkipDatesByRule = new Map();
            recurringOccurrences.forEach((item) => {
              const key = String(item.sourceRuleId);
              if (!recurringSkipDatesByRule.has(key)) recurringSkipDatesByRule.set(key, new Set());
              recurringSkipDatesByRule.get(key).add(item.date);
            });
            state.recurringRules = state.recurringRules.map((rule) => {
              const skipSet = recurringSkipDatesByRule.get(String(rule.id));
              if (!skipSet) return rule;
              return { ...rule, skipDates: [...new Set([...(rule.skipDates || []), ...Array.from(skipSet)])] };
            });

            const processOccurrences = getProcessOccurrences(startDate, endDate);
            const processSkipKeysByRule = new Map();
            processOccurrences.forEach((item) => {
              const key = String(item.sourceProcessRuleId);
              if (!processSkipKeysByRule.has(key)) processSkipKeysByRule.set(key, new Set());
              processSkipKeysByRule.get(key).add(buildProcessSkipKey(item.sourceProcessStepId, item.date));
            });
            state.processRules = state.processRules.map((rule) => {
              const skipSet = processSkipKeysByRule.get(String(rule.id));
              if (!skipSet) return rule;
              return { ...rule, skipOccurrences: [...new Set([...(rule.skipOccurrences || []), ...Array.from(skipSet)])] };
            });
          }
          if (targets.todos) state.todos = state.todos.filter((item) => !item.dueDate || item.dueDate < startDate || item.dueDate > endDate);
          if (targets.completed) state.completedTodos = state.completedTodos.filter((item) => !item.completedDate || item.completedDate < startDate || item.completedDate > endDate);
          persist();
          closeModal();
          render();

            document.getElementById("settingsLastNotification").textContent = "僅桌機版可用";
            document.getElementById("settingsLastAutoBackup").textContent = state.settings.autoBackupLastAt ? formatDateTimeLabel(state.settings.autoBackupLastAt) : "尚未自動備份";
            return;
          }
          document.getElementById("settingsAppVersion").textContent = "讀取中";
          document.getElementById("settingsAutostartStatus").textContent = "讀取中";
          document.getElementById("settingsScheduledCount").textContent = "讀取中";
          document.getElementById("settingsDeliveredCount").textContent = "讀取中";
          document.getElementById("settingsNextReminder").textContent = "讀取中";
          document.getElementById("settingsLastNotification").textContent = "讀取中";
          document.getElementById("settingsLastAutoBackup").textContent = state.settings.autoBackupLastAt ? formatDateTimeLabel(state.settings.autoBackupLastAt) : "尚未自動備份";
          window.getDesktopReminderDiagnostics().then((result) => {
            document.getElementById("settingsAppVersion").textContent = result?.appVersion || "未知";
            document.getElementById("settingsScheduledCount").textContent = String(result?.scheduledCount ?? 0);
            document.getElementById("settingsDeliveredCount").textContent = String(result?.deliveredCount ?? 0);
            document.getElementById("settingsNextReminder").textContent = result?.nextReminderAt ? formatDateTimeLabel(result.nextReminderAt) : "目前沒有待提醒項目";
            document.getElementById("settingsLastNotification").textContent = result?.lastNotificationAt ? formatDateTimeLabel(result.lastNotificationAt) : "尚未送出通知";
            document.getElementById("settingsLastAutoBackup").textContent = result?.lastAutoBackupAt

              : (state.settings.autoBackupLastAt ? formatDateTimeLabel(state.settings.autoBackupLastAt) : "尚未自動備份");
            if (typeof window.getAutostartEnabled === "function") {
              window.getAutostartEnabled().then((enabled) => {

        document.getElementById("exportDataButton").addEventListener("click", async () => {

            try {
              const selectedFolder = await window.choosePlannerExportFolder("");

                preferredDir = selectedFolder;
                document.getElementById("settingsExportFolder").value = selectedFolder;
                state.settings.exportFolder = selectedFolder;
                persist();
              }
            } catch (_error) {}
          }
          if (
            githubOwner &&
            githubRepo &&
            githubToken &&
            typeof window.syncReadonlyWebToGithub === "function"
          ) {
            try {

                JSON.stringify(payload, null, 2),
                preferredDir,
                githubOwner,
                githubRepo,
                githubBranch,
                githubToken
              );
              await showActionDialog({
                title: "已同步到 GitHub Pages",
                message: `已更新：${result?.filePath || "index.html"}\nPages 網址：${result?.pageUrl || ""}`,

                cancelText: ""
              });

              window.alert("同步到 GitHub Pages 失敗，請確認 GitHub 帳號、Repository、Branch 與 Token 是否正確。");
            }
            return;
          }
          if (typeof window.exportReadonlyWebHtml === "function") {
            try {
              const result = await window.exportReadonlyWebHtml(
                JSON.stringify(payload, null, 2),
                preferredDir
              );
              await showActionDialog({
                title: "已同步到 Web",
                message: `可分享的唯讀 HTML 已更新到：${result?.filePath || "指定資料夾"}`,
                actions: [{ label: "知道了", value: "ok" }]
              });
            } catch (_error) {
              window.alert("同步到 Web 失敗，請稍後再試。");
            }
            return;

        document.getElementById("saveSettingsButton").addEventListener("click", () => {

          state.settings.autostartConfigured = true;
          state.settings.autostartUserDisabled = !state.settings.autostartEnabled;
          state.settings.autoBackupEnabled = Boolean(document.getElementById("autoBackupToggle")?.checked);
          state.settings.autoSyncWebEnabled = Boolean(document.getElementById("autoSyncWebToggle")?.checked);
          state.settings.exportFolder = document.getElementById("settingsExportFolder")?.value?.trim() || "";
          state.settings.githubOwner = document.getElementById("settingsGithubOwner")?.value?.trim() || "";
          state.settings.githubRepo = document.getElementById("settingsGithubRepo")?.value?.trim() || "";
          state.settings.githubBranch = document.getElementById("settingsGithubBranch")?.value?.trim() || "main";
          state.settings.githubToken = document.getElementById("settingsGithubToken")?.value?.trim() || "";
          state.settings.categories = Array.from(document.querySelectorAll("[data-category-row]")).map((item) => item.getAttribute("data-category-row")).filter(Boolean);
          state.settings.categoryColors = Array.from(document.querySelectorAll("[data-category-color]")).reduce((result, input) => {

              persist();

        syncWidgetLayer();

        document.getElementById("modalBackdrop").addEventListener("click", closeOverlayModal);

        document.getElementById("closeModalButton").addEventListener("click", closeOverlayModal);
        document.getElementById("openRecurringRuleButton").addEventListener("click", openRecurringRuleModal);
        document.getElementById("openProcessRuleButton")?.addEventListener("click", () => openProcessRuleModal());
        modalPanel.addEventListener("click", (event) => {
          const target = event.target;

      function openProcessRuleModal(options = {}) {

        }

        function buildAnchorOptions(stepId, currentAnchorStepId, steps, currentIndex) {
          return steps
            .filter((candidate, candidateIndex) => candidate.id === "main" || (candidate.id !== stepId && candidateIndex < currentIndex))

              const label = candidate.id === "main"

                      <input data-step-start-time="${step.id}" type="hidden" value="${step.startTime || "10:00"}" />
                    </div>
                  </label>
                  <label class="field">
                    <span>結束時間</span>
                    <div class="time-picker" data-process-picker="${step.id}-end">
                      <input class="time-trigger" data-step-end-trigger="${step.id}" type="text" autocomplete="off" spellcheck="false" value="${formatTimeDisplay(step.endTime || "11:00")}" />
                      <div class="time-popup hidden" data-step-end-popup="${step.id}"></div>
                      <input data-step-end-time="${step.id}" type="hidden" value="${step.endTime || "11:00"}" />
                    </div>
                  </label>
                  <label class="field">
                    <span>提醒</span>
                    <select data-step-reminder="${step.id}">
                      ${buildEventReminderOptions(step.reminder || "不提醒")}

                  </label>
                </div>
              ` : `
                <label class="field">
                  <span>標題</span>
                  <div class="field-grid" style="grid-template-columns:minmax(0, 1.35fr) minmax(180px, 1fr); gap:0.6rem;">
                    <input data-step-title="${step.id}" autocomplete="off" value="${step.title || ""}" />
                    <select data-step-anchor="${step.id}">
                      ${buildAnchorOptions(step.id, step.anchorStepId || "main", steps, index)}
