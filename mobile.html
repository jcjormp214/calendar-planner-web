<!doctype html>
<html lang="zh-Hant">
  <head>
    <script>window.__PLANNER_MOBILE__ = true;</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Planner Preview</title>
    <style>
      :root {
        --accent-1: #f97316;
        --accent-2: #fb923c;
        --accent-strong: #b45309;
        --accent-soft: #ffedd5;
        --accent-shadow: rgba(249, 115, 22, 0.24);
        --accent-border: rgba(249, 115, 22, 0.18);
        --accent-text-on: #fff7ed;
        --bg-glow-warm: rgba(255, 214, 165, 0.42);
        --bg-glow-cool: rgba(145, 200, 255, 0.28);
        --tone-busy-top: #fee2e2;
        --tone-normal-top: #eff6ff;
        --tone-light-top: #ecfccb;
        --month-mini-bg: rgba(255, 237, 213, 0.78);
        --month-mini-text: #7c2d12;
        --panel-border: #eadfce;
        --surface-soft: #fffaf4;
        --surface-plain: #fff;
        --control-bg: rgba(255, 248, 240, 0.96);
        --control-border: rgba(180, 83, 9, 0.16);
        --control-text: #7c2d12;
        color: #1f2937;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background:
          radial-gradient(circle at top left, var(--bg-glow-warm), transparent 28%),
          radial-gradient(circle at top right, var(--bg-glow-cool), transparent 22%),
          linear-gradient(180deg, #f8f5ef 0%, #f3efe6 100%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        accent-color: var(--accent-1);
        color-scheme: light;
        background:
          radial-gradient(circle at top left, var(--bg-glow-warm), transparent 28%),
          radial-gradient(circle at top right, var(--bg-glow-cool), transparent 22%),
          linear-gradient(180deg, #f8f5ef 0%, #f3efe6 100%);
      }

      body.desktop-app {
        overflow: hidden;
      }

      body.desktop-app .app-shell {
        min-height: 100vh;
        overflow: hidden;
      }

      body.widget-app {
        overflow: hidden;
        background: linear-gradient(180deg, #f97316, #fb923c);
      }

      body.widget-app .app-shell,
      body.widget-app .widget-launcher {
        display: none;
      }

      body.widget-app #modalRoot {
        position: static;
        inset: auto;
      }

      body.widget-app .modal-backdrop {
        position: static;
        min-height: 100vh;
        padding: 10px;
        background: transparent;
        align-items: stretch;
      }

      body.widget-app .modal-panel {
        width: 100%;
        max-height: none;
        min-height: calc(100vh - 20px);
        padding: 0.95rem;
        border-radius: 18px;
        border: 1px solid rgba(249, 115, 22, 0.18);
        background: rgba(38, 47, 66, 0.94);
        box-shadow: 0 18px 36px rgba(249, 115, 22, 0.22);
        color: #f8fafc;
      }

      body.widget-app .modal-panel .eyebrow,
      body.widget-app .modal-panel .card-label,
      body.widget-app .modal-panel .subtle-meta,
      body.widget-app .modal-panel p {
        color: rgba(241, 245, 249, 0.84);
      }

      body.widget-app .modal-panel h3,
      body.widget-app .modal-panel h4 {
        color: #fff7ed;
      }

      body.widget-app #closeModalButton {
        display: none;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        width: 280px;
        height: 100vh;
        padding: 2rem 1.25rem;
        background: rgba(28, 37, 55, 0.94);
        color: #f9fafb;
        overflow: hidden;
        transform: translateX(calc(-100% + 24px));
        transition: transform 0.22s ease;
        box-shadow: 18px 0 44px rgba(17, 24, 39, 0.16);
      }

      .sidebar:hover {
        transform: translateX(0);
      }

      body.desktop-app .sidebar {
        display: none;
      }

      body.desktop-app .sidebar::after {
        display: none;
      }

      body.desktop-app .sidebar h1 {
        font-size: 1.78rem;
        line-height: 1.02;
        margin-bottom: 0.38rem;
      }

      body.desktop-app .brand-copy {
        font-size: 0.92rem;
        line-height: 1.35;
      }

      body.desktop-app .nav-pill,
      body.desktop-app .ghost-button,
      body.desktop-app .primary-button,
      body.desktop-app .week-nav-button {
        padding: 0.64rem 0.82rem;
      }

      .sidebar-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .sidebar-toggle {
        flex: none;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        cursor: pointer;
      }

      .sidebar-label {
        display: inline;
      }

      .sidebar-short-label {
        display: none;
      }

      .sidebar::after {
        content: "";
        position: absolute;
        top: 94px;
        right: 5px;
        width: 10px;
        height: 58px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
        box-shadow: 0 10px 22px var(--accent-shadow);
      }

      .eyebrow {
        margin: 0 0 0.35rem;
        color: #7c8aa5;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin-top: 0;
      }

      .brand-copy,
      .muted,
      .card-copy,
      .helper {
        color: #94a3b8;
      }

      .main-nav {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .nav-pill,
      .ghost-button,
      .primary-button,
      .week-nav-button {
        border: 0;
        border-radius: 999px;
        padding: 0.8rem 1.05rem;
        cursor: pointer;
      }

      .nav-pill {
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        text-align: left;
        white-space: nowrap;
      }

      body.desktop-app.sidebar-collapsed .nav-pill {
        text-align: center;
        padding-inline: 0.2rem;
      }

      .nav-pill.active {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #111827;
        font-weight: 700;
      }

      .ghost-button,
      .week-nav-button {
        background: linear-gradient(180deg, var(--surface-soft), color-mix(in srgb, var(--accent-soft) 45%, white));
        color: var(--accent-strong);
        border: 1px solid var(--panel-border);
      }

      .ghost-button:disabled,
      .primary-button:disabled,
      .week-nav-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }

      .primary-button {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: var(--accent-text-on);
      }

      .card-time {
        margin: 0.25rem 0;
        color: #fff7ed;
        font-size: 2rem;
        font-weight: 700;
      }

      .main-panel {
        padding: 2rem;
        padding-left: calc(24px + 2rem);
      }

      body.desktop-app .main-panel {
        min-height: 100vh;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: scroll;
        scrollbar-gutter: stable both-edges;
        padding: 0.72rem 0.8rem 0.85rem;
      }

      body.desktop-app .topbar h2 {
        font-size: 1.55rem;
        margin-bottom: 0;
      }

      body.desktop-app .topbar {
        align-items: center;
        gap: 0.8rem;
      }

      .topbar,
      .section-header,
      .timeline-item,
      .todo-item,
      .week-controls,
      .week-modal-item {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 1rem;
      }

      .modal-panel > .topbar,
      .modal-panel > .week-modal-header {
        position: sticky;
        top: -0.9rem;
        z-index: 8;
        margin: -0.9rem -0.1rem 0.72rem;
        padding: 0.9rem 0.1rem 0.7rem;
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface-soft) 96%, white), color-mix(in srgb, var(--accent-soft) 18%, var(--surface-soft)));
        border-bottom: 1px solid color-mix(in srgb, var(--accent-1) 10%, var(--panel-border));
      }

      .topbar-actions,
      .quick-add-row,
      .meta-row,
      .composer-actions {
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }

      .topbar-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
      }

      .topbar-nav .nav-pill {
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 28%, white), color-mix(in srgb, var(--surface-soft) 94%, white));
        border: 1px solid color-mix(in srgb, var(--accent-1) 14%, white);
        color: var(--accent-strong);
        padding: 0.48rem 0.84rem;
        border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 3px 10px color-mix(in srgb, var(--accent-1) 5%, transparent);
      }

      .topbar-nav .nav-pill.active {
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 70%, white), color-mix(in srgb, var(--accent-soft) 46%, var(--surface-soft)));
        color: var(--accent-strong);
        border-color: color-mix(in srgb, var(--accent-1) 24%, white);
        box-shadow: 0 8px 18px color-mix(in srgb, var(--accent-1) 8%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }

      .card {
        padding: 1.35rem;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: rgba(255, 251, 245, 0.9);
        box-shadow: 0 14px 40px rgba(90, 72, 40, 0.08);
      }

      .card-label {
        margin: 0 0 0.35rem;
        color: var(--accent-strong);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-label.prominent {
        font-size: 0.92rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.36fr);
        gap: 1.25rem;
        margin-top: 1.5rem;
        align-items: start;
      }

      body.desktop-app .content-grid {
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 0.85rem;
        margin-top: 0.75rem;
      }

      body.desktop-app .card {
        padding: 0.62rem 0.72rem;
        border-radius: 20px;
      }

      body.desktop-app .timeline-item,
      body.desktop-app .todo-item,
      body.desktop-app .week-modal-item {
        gap: 0.55rem;
      }

      body.desktop-app .section-header h3,
      body.desktop-app .summary-stack h3,
      body.desktop-app .next-event-card h3,
      body.desktop-app .todo-panel h3 {
        font-size: 1.3rem;
      }

      #leftColumn {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        align-self: start;
      }

      #rightRail {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        align-self: start;
      }

      #leftColumn > .card,
      #rightRail > .card {
        align-self: start;
        width: 100%;
      }

      .quick-input {
        flex: 1;
        padding: 0.82rem 0.92rem;
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: var(--surface-soft);
      }

      .quick-card-compact h3 {
        margin-bottom: 0.4rem;
        font-size: 1.06rem;
      }

      .quick-helper {
        margin: 0 0 0.55rem;
        color: #7c8aa5;
        font-size: 0.9rem;
      }

      .quick-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.6rem;
        align-items: start;
      }

      .quick-toolbar-group {
        display: flex;
        gap: 0.55rem;
        align-items: center;
        min-width: 0;
      }

      .search-group {
        position: relative;
      }

      .search-suggestion-panel {
        position: absolute;
        top: calc(100% + 0.35rem);
        left: 0;
        right: 0;
        z-index: 18;
        padding: 0.35rem;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--surface-plain) 96%, white);
        box-shadow: 0 18px 36px rgba(90, 72, 40, 0.14);
      }

      .search-suggestion-item {
        display: flex;
        justify-content: space-between;
        gap: 0.7rem;
        width: 100%;
        padding: 0.6rem 0.72rem;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--text-strong);
        text-align: left;
        cursor: pointer;
      }

      .search-suggestion-item:hover,
      .search-suggestion-item:focus,
      .search-suggestion-item.active {
        background: color-mix(in srgb, var(--accent-soft) 62%, var(--accent-1) 10%);
      }

      .search-suggestion-item strong {
        display: block;
        margin-bottom: 0.12rem;
      }

      .origin-notice {
        display: flex;
        gap: 0.7rem;
        align-items: flex-start;
        padding: 0.72rem 0.84rem;
        border: 1px solid color-mix(in srgb, var(--accent-1) 16%, white);
        border-radius: 16px;
        background: color-mix(in srgb, var(--accent-soft) 45%, white);
        color: var(--accent-strong);
      }

      .origin-notice strong {
        display: block;
        margin-bottom: 0.12rem;
        font-size: 0.94rem;
      }

      .origin-notice p {
        margin: 0;
        color: color-mix(in srgb, var(--accent-strong) 78%, #334155);
        font-size: 0.86rem;
        line-height: 1.45;
      }

      .search-suggestion-item .subtle-meta {
        margin: 0;
      }

      .search-suggestion-empty {
        padding: 0.7rem 0.78rem;
        color: #7c8aa5;
        font-size: 0.9rem;
      }

      .week-stage {
        display: grid;
        grid-template-columns: 56px 1fr 56px;
        gap: 0.65rem;
        align-items: center;
        touch-action: pan-y;
      }

      .edge-lane {
        position: relative;
        height: 126px;
        overflow: hidden;
      }

      .week-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.55rem;
      }

      .day-card {
        min-width: 0;
        padding: 0.74rem 0.4rem;
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        background: var(--surface-plain);
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      }

      .day-card strong {
        font-size: 0.98rem;
        letter-spacing: -0.01em;
      }

      .day-card span {
        font-size: 0.92rem;
      }

      .day-card .holiday-note {
        display: block;
        margin-top: 0.08rem;
        font-size: 0.74rem;
        color: #b91c1c;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .calendar-marker-row {
        display: flex;
        gap: 0.24rem;
        margin-top: 0.34rem;
        min-height: 8px;
        flex-wrap: wrap;
      }

      .calendar-marker-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      }

      .day-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(249, 115, 22, 0.08);
      }

      .day-card p,
      .day-card strong,
      .day-card span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .busy {
        background: linear-gradient(180deg, var(--tone-busy-top), #fff7ed);
      }

      .normal {
        background: linear-gradient(180deg, var(--tone-normal-top), #ffffff);
      }

      .light {
        background: linear-gradient(180deg, var(--tone-light-top), #ffffff);
      }

      .empty {
        opacity: 0.72;
      }

      .day-card.selected {
        border-color: var(--accent-1);
        box-shadow: 0 0 0 2px var(--accent-border);
      }

      .day-card.is-today {
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 86%, white), #fffdf8);
        border-color: color-mix(in srgb, var(--accent-1) 42%, white);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-1) 14%, white);
      }

      .day-card.is-past {
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 24%, #eef2f7), #f8fafc);
        border-color: color-mix(in srgb, #cbd5e1 74%, var(--panel-border));
      }

      .day-card.is-past p,
      .day-card.is-past strong,
      .day-card.is-past span {
        color: #64748b;
      }

      .is-holiday p,
      .is-holiday strong {
        color: #b91c1c;
      }

      .is-holiday.selected p,
      .is-holiday.selected strong {
        color: #9a3412;
      }

      .holiday-banner {
        margin-bottom: 0.7rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid rgba(185, 28, 28, 0.16);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(254, 242, 242, 0.95), rgba(255, 255, 255, 0.98));
      }

      .holiday-banner .card-label {
        color: #b91c1c;
      }

      .holiday-banner strong {
        display: block;
        color: #7f1d1d;
        font-size: 1rem;
        letter-spacing: -0.01em;
      }

      .edge-day-card {
        position: absolute;
        top: 8px;
        width: 86px;
        padding: 0.9rem 0.55rem;
        border: 1px solid rgba(223, 210, 190, 0.9);
        border-radius: 18px;
        background: linear-gradient(180deg, var(--accent-soft), rgba(255, 255, 255, 0.7));
        opacity: 0.52;
        transform: perspective(600px) rotateY(18deg) scale(0.95);
        transform-origin: center left;
        box-shadow: 0 8px 24px rgba(90, 72, 40, 0.06);
      }

      .edge-lane.left .edge-day-card {
        left: -48px;
      }

      .edge-day-card.right {
        right: -48px;
        transform: perspective(600px) rotateY(-18deg) scale(0.95);
        transform-origin: center right;
      }

      .edge-day-card p,
      .edge-day-card strong,
      .edge-day-card span {
        display: block;
      }

      .edge-day-card.is-holiday p,
      .edge-day-card.is-holiday strong {
        color: #b91c1c;
      }

      .week-arrow {
        position: absolute;
        top: 50%;
        z-index: 2;
        width: 24px;
        height: 56px;
        border: 0;
        background: transparent;
        color: var(--accent-strong);
        font-size: 2rem;
        font-weight: 700;
        cursor: pointer;
        transform: translateY(-50%);
        text-shadow: 0 8px 18px rgba(90, 72, 40, 0.12);
      }

      .week-arrow:hover {
        color: var(--accent-1);
      }

      .edge-lane.left .week-arrow {
        right: 6px;
      }

      .edge-lane.right .week-arrow {
        left: 6px;
      }

      .stat-list {
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
      }

      .stat-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .stat-list li + li,
      .todo-item + .todo-item,
      .timeline-item + .timeline-item,
      .week-modal-item + .week-modal-item {
        margin-top: 0.9rem;
      }

      .timeline-item,
      .todo-item,
      .week-modal-item {
        padding: 0.58rem 0.8rem;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: var(--surface-plain);
      }

      .timeline-item.is-past {
        opacity: 0.6;
        background: linear-gradient(180deg, #f8f3ec, #fff);
      }

      .clickable-row {
        cursor: pointer;
      }

      .clickable-row:hover {
        border-color: #f4b98a;
        box-shadow: 0 10px 24px rgba(249, 115, 22, 0.08);
      }

      .clickable-row[aria-disabled="true"] {
        cursor: default;
      }

      .clickable-row[aria-disabled="true"]:hover {
        border-color: var(--panel-border);
        box-shadow: none;
      }

      .timeline-time {
        margin-bottom: 0.15rem;
        color: var(--accent-strong);
        font-size: 0.9rem;
      }

      .subtle-meta {
        margin-top: 0.12rem;
        color: #6b7280;
        font-size: 0.84rem;
      }

      .inline-summary {
        margin-bottom: 1rem;
        padding: 0.9rem 1rem;
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        background: linear-gradient(180deg, var(--surface-soft), var(--surface-plain));
      }

      .completed-section {
        margin-top: 0.95rem;
        padding-top: 0.95rem;
        border-top: 1px dashed var(--panel-border);
      }

      .todo-item.completed {
        opacity: 0.58;
        background: linear-gradient(180deg, #f7f3ed, #fff);
      }

      .category-badge,
      .priority-badge {
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .category-badge {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .priority-high {
        background: #fee2e2;
        color: #b91c1c;
      }

      .priority-medium {
        background: #fef3c7;
        color: #b45309;
      }

      .priority-low {
        background: #dcfce7;
        color: #15803d;
      }

      .todo-item label {
        display: flex;
        align-items: start;
        gap: 0.65rem;
      }

      };

      function toLocalIsoDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function createLocalDate(isoDate) {
        const [year, month, day] = isoDate.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function addDays(isoDate, offset) {
        const date = createLocalDate(isoDate);
        date.setDate(date.getDate() + offset);
        return toLocalIsoDate(date);
      }

      function getWeekStart(isoDate) {
        const date = createLocalDate(isoDate);
        const offset = date.getDay();
        date.setDate(date.getDate() - offset);
        return toLocalIsoDate(date);
      }

      function isHolidayDate(isoDate) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return false;
        const manualOverride = getManualWorkdayOverride(normalizedDate);
        if (manualOverride === "workday") return false;
        if (manualOverride === "holiday") return true;
        const date = createLocalDate(normalizedDate);
        if (date.getDay() === 0 || date.getDay() === 6) return true;
        return FIXED_HOLIDAY_MONTH_DAYS.has(normalizedDate.slice(5));
      }

      function normalizeWorkdayCalendarEntry(entry) {
        if (!entry || typeof entry !== "object") return null;
        const year = Number(entry.year);
        if (!Number.isInteger(year) || year < 1900 || year > 9999) return null;
        const normalizeDateArray = (values) => [...new Set(
          (Array.isArray(values) ? values : [])
            .map((item) => normalizeDateInputValue(item))
            .filter((item) => item && item.startsWith(`${year}-`))
        )].sort();
        return {
          year,
          sourceName: String(entry.sourceName || "手動設定").trim() || "手動設定",
          filePath: String(entry.filePath || "").trim(),
          importedAt: String(entry.importedAt || "").trim(),
          holidayDates: normalizeDateArray(entry.holidayDates),
          workdayOverrideDates: normalizeDateArray(entry.workdayOverrideDates)
        };
      }

      function getManualWorkdayOverride(isoDate) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return null;
        const year = Number(normalizedDate.slice(0, 4));
        const calendar = (state.settings?.workdayCalendars || []).find((item) => Number(item.year) === year);
        if (!calendar) return null;
        if (Array.isArray(calendar.workdayOverrideDates) && calendar.workdayOverrideDates.includes(normalizedDate)) return "workday";
        if (Array.isArray(calendar.holidayDates) && calendar.holidayDates.includes(normalizedDate)) return "holiday";
        return null;
      }

      function buildWorkdayEntryKey(entryType, isoDate) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return "";
        return `${entryType === "workday" ? "workday" : "holiday"}:${normalizedDate}`;
      }

      function getBuiltinHolidayName(isoDate) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return "";
        return FIXED_HOLIDAY_DEFINITIONS[normalizedDate.slice(5)] || "";
      }

      function formatDateLabel(isoDate) {
        const date = createLocalDate(isoDate);
        if (Number.isNaN(date.getTime())) return "未指定日期";
        return date.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long" });
      }

      function formatDateTimeLabel(value) {
        if (!value) return "未排定";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "未排定";
        return date.toLocaleString("zh-TW", {
          month: "numeric",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",

      function normalizeCompletedAtValue(completedAt, completedDate) {
        const raw = String(completedAt || "").trim();
        if (!raw) return "";
        const normalizedDate = normalizeDateInputValue(completedDate || "");
        if (!normalizedDate) return raw;

        const legacyExactValues = new Set([
          `${normalizedDate}T00:00`,
          `${normalizedDate}T00:00:00`,
          `${normalizedDate} 00:00`,

        if (legacyExactValues.has(raw)) return "";

        const parsed = new Date(raw);
        if (!Number.isNaN(parsed.getTime())) {

        const minute = String(now.getMinutes()).padStart(2, "0");

      function formatDateEyebrow(isoDate) {

      function upsertWorkdayCalendarEntry(calendars, isoDate, entryType) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return Array.isArray(calendars) ? calendars : [];
        const year = Number(normalizedDate.slice(0, 4));
        const normalizedCalendars = Array.isArray(calendars)
          ? calendars.map((item) => normalizeWorkdayCalendarEntry(item)).filter(Boolean)
          : [];
        let target = normalizedCalendars.find((item) => Number(item.year) === year);
        if (!target) {
          target = normalizeWorkdayCalendarEntry({
            year,
            sourceName: "手動設定",
            holidayDates: [],
            workdayOverrideDates: []
          });
          normalizedCalendars.push(target);
        }
        target.holidayDates = (target.holidayDates || []).filter((item) => item !== normalizedDate);
        target.workdayOverrideDates = (target.workdayOverrideDates || []).filter((item) => item !== normalizedDate);
        if (entryType === "holiday") {
          target.holidayDates = [...new Set([...(target.holidayDates || []), normalizedDate])].sort();
        } else {
          target.workdayOverrideDates = [...new Set([...(target.workdayOverrideDates || []), normalizedDate])].sort();
        }
        return normalizedCalendars
          .map((item) => normalizeWorkdayCalendarEntry(item))
          .filter(Boolean)
          .sort((a, b) => Number(a.year) - Number(b.year));
      }

      function removeWorkdayCalendarDate(calendars, isoDate, entryType) {
        const normalizedDate = normalizeDateInputValue(isoDate);
        if (!normalizedDate) return Array.isArray(calendars) ? calendars : [];
        return (Array.isArray(calendars) ? calendars : [])
          .map((item) => normalizeWorkdayCalendarEntry(item))
          .filter(Boolean)
          .map((item) => {
            if (entryType === "holiday") {
              return { ...item, holidayDates: (item.holidayDates || []).filter((value) => value !== normalizedDate) };
            }
            return { ...item, workdayOverrideDates: (item.workdayOverrideDates || []).filter((value) => value !== normalizedDate) };
          })
          .filter((item) => (item.holidayDates?.length || 0) > 0 || (item.workdayOverrideDates?.length || 0) > 0)
          .sort((a, b) => Number(a.year) - Number(b.year));
      }

      function getBuiltinHolidayYears(calendars) {
        const currentYear = new Date().getFullYear();
        return [...new Set([
          currentYear,
          currentYear + 1,
          ...((Array.isArray(calendars) ? calendars : [])
            .map((item) => normalizeWorkdayCalendarEntry(item))
            .filter(Boolean)
            .map((item) => Number(item.year)))
        ])]
          .filter((year) => Number.isInteger(year))
          .sort((a, b) => a - b);

      function flattenWorkdayCalendarEntries(calendars, labels = {}) {
        const manualEntries = (Array.isArray(calendars) ? calendars : [])
          .map((item) => normalizeWorkdayCalendarEntry(item))
          .filter(Boolean)
          .flatMap((item) => {
            const holidays = (item.holidayDates || []).map((date) => ({
              date,

              label: "放假日",
              sourceName: item.sourceName || "手動設定",
              name: String(labels[buildWorkdayEntryKey("holiday", date)] || "").trim()

            const workdays = (item.workdayOverrideDates || []).map((date) => ({
              date,
              type: "workday",
              label: "補班日",
              sourceName: item.sourceName || "手動設定",
              name: String(labels[buildWorkdayEntryKey("workday", date)] || "").trim()
            }));
            return [...holidays, ...workdays];
          });
        const manualKeys = new Set(manualEntries.map((entry) => `${entry.type}:${entry.date}`));
        const builtinEntries = getBuiltinHolidayYears(calendars)
          .flatMap((year) => Object.entries(FIXED_HOLIDAY_DEFINITIONS).map(([monthDay, defaultName]) => {
            const date = `${year}-${monthDay}`;
            return {
              date,
              type: "holiday",
              label: "放假日",
              sourceName: "內建國定假日",
              name: String(labels[buildWorkdayEntryKey("holiday", date)] || defaultName || "").trim(),
              isBuiltin: true
            };
          }))
          .filter((entry) => !manualKeys.has(`${entry.type}:${entry.date}`));
        return [...manualEntries, ...builtinEntries]
          .sort((a, b) => a.date.localeCompare(b.date));

      function escapeCsvValue(value) {
        const text = String(value ?? "");
        if (/[",\r\n]/.test(text)) {
          return `"${text.replace(/"/g, "\"\"")}"`;
        }
        return text;
      }

      function buildHolidaySettingsCsv(calendars, entryLabels) {
        const entries = flattenWorkdayCalendarEntries(calendars, entryLabels);
        const rows = [
          ["日期", "類型", "名稱"],
          ...entries.map((entry) => [
            toSlashDate(entry.date),
            entry.type === "workday" ? "補班日" : "放假日",
            entry.name || ""
          ])
        ];
        return `\uFEFF${rows.map((row) => row.map(escapeCsvValue).join(",")).join("\r\n")}`;
      }

      function parseCsvRow(line) {
        const result = [];
        let current = "";
        let inQuotes = false;
        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const nextChar = line[index + 1];
          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              current += '"';
              index += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result.map((value) => String(value || "").trim());
      }

      function buildHolidaySettingsStateFromEntries(entries) {
        let workdayCalendars = [];
        let workdayEntryLabels = {};
        (Array.isArray(entries) ? entries : []).forEach((entry) => {
          const isoDate = normalizeDateInputValue(entry.date || "");
          const entryType = entry.type === "workday" ? "workday" : "holiday";
          const entryName = String(entry.name || "").trim();
          if (!isoDate) return;
          workdayCalendars = upsertWorkdayCalendarEntry(workdayCalendars, isoDate, entryType);
          const entryKey = buildWorkdayEntryKey(entryType, isoDate);
          if (entryName) workdayEntryLabels[entryKey] = entryName;
        });
        return { workdayCalendars, workdayEntryLabels };
      }

      function parseHolidaySettingsCsv(rawText) {
        const text = String(rawText || "").replace(/^\uFEFF/, "");
        const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        if (lines.length === 0) {
          return { workdayCalendars: [], workdayEntryLabels: {} };
        }
        const rows = lines.map(parseCsvRow);
        const bodyRows = rows.slice(1);
        const entries = bodyRows.map((row) => {
          const dateValue = row[0] || "";
          const typeValue = row[1] || "";
          const nameValue = row[2] || "";
          return {
            date: dateValue,
            type: /補班|workday/i.test(typeValue) ? "workday" : "holiday",
            name: nameValue
          };
        });
        return buildHolidaySettingsStateFromEntries(entries);
      }

          const hasBackupBridge =
            typeof window.runDailyAutoBackup === "function" &&
            typeof window.updateAutoBackupSnapshot === "function";
          if (hasAutostartBridge || hasBackupBridge) {
            // Keep the calendar interactive before starting backup or network maintenance.
            window.setTimeout(() => {

                  await syncAutoBackupSnapshot();

      function getReminderCustomTime(reminder) {
        const match = /(?:今天|截止日當天) (\d{2}:\d{2})$/.exec(String(reminder || ""));
        return match ? match[1] : "18:00";
      }

      function isCustomReminderValue(reminder, itemType = "event") {
        const raw = String(reminder || "").trim();
        if (getReminderBaseOptions(itemType).includes(raw)) return false;
        return itemType === "todo"
          ? /^截止日當天 \d{2}:\d{2}$/.test(raw)
          : /^今天 \d{2}:\d{2}$/.test(raw);
      }

      function getCustomReminderLiteral(itemType = "event", time = "18:00") {

          ? `截止日當天 ${time}`
          : `今天 ${time}`;
      }

      function getEventReminderBaseOptions(isAllDay = false) {

          : ["不提醒", "提前 10 分鐘", "提前 30 分鐘", "提前 1 小時", "提前 1 天", "提前 2 天"];
      }

      function normalizeEventReminderByAllDay(reminder, isAllDay = false) {
        const raw = String(reminder || "不提醒").trim();
        if (raw === "不提醒") return "不提醒";
        if (/^今天 \d{2}:\d{2}$/.test(raw)) return raw;
        return getEventReminderBaseOptions(isAllDay).includes(raw) ? raw : "不提醒";
      }

      function getReminderSelectValue(reminder, itemType = "event", options = {}) {
        if (itemType === "todo") {
          if (reminder === "不提醒") return reminder;
          if (["截止日當天 09:00", "截止日當天 18:00", "截止日前一天 18:00"].includes(reminder)) return reminder;
          if (/^截止日當天 \d{2}:\d{2}$/.test(String(reminder || ""))) return "自訂時間";
          return "不提醒";
        }
        if (getEventReminderBaseOptions(Boolean(options.allDay)).includes(reminder)) return reminder;
        if (/^今天 \d{2}:\d{2}$/.test(String(reminder || ""))) return "自訂時間";
        return "不提醒";
      }

      function buildEventReminderOptions(selectedReminder = "不提醒") {

          <option value="不提醒" ${selectedReminder === "不提醒" ? "selected" : ""}>不提醒</option>
          <option value="提前 10 分鐘" ${selectedReminder === "提前 10 分鐘" ? "selected" : ""}>提前 10 分鐘</option>
          <option value="提前 30 分鐘" ${selectedReminder === "提前 30 分鐘" ? "selected" : ""}>提前 30 分鐘</option>
          <option value="提前 1 小時" ${selectedReminder === "提前 1 小時" ? "selected" : ""}>提前 1 小時</option>
          <option value="提前 1 天" ${selectedReminder === "提前 1 天" ? "selected" : ""}>提前 1 天</option>

        `;
      }

      function buildTodoReminderOptions(selectedReminder = "不提醒") {
        return `
          <option value="不提醒" ${selectedReminder === "不提醒" ? "selected" : ""}>不提醒</option>
          <option value="截止日當天 09:00" ${selectedReminder === "截止日當天 09:00" ? "selected" : ""}>截止日當天 09:00</option>
          <option value="截止日當天 18:00" ${selectedReminder === "截止日當天 18:00" ? "selected" : ""}>截止日當天 18:00</option>
          <option value="截止日前一天 18:00" ${selectedReminder === "截止日前一天 18:00" ? "selected" : ""}>截止日前一天 18:00</option>
        `;
      }

      function getReminderBaseOptions(itemType = "event", options = {}) {
        return itemType === "event"
          ? getEventReminderBaseOptions(Boolean(options.allDay))
          : ["不提醒", "截止日當天 09:00", "截止日當天 18:00", "截止日前一天 18:00"];
      }

      function populateReminderSelect(selectElement, itemType = "event", reminder = "不提醒", options = {}) {
        if (!(selectElement instanceof HTMLSelectElement)) {
          return { selectValue: "不提醒", customTime: "18:00" };
        }

        let normalizedReminder = normalizeReminderForType(reminder, itemType);
        if (itemType === "event") {
          normalizedReminder = normalizeEventReminderByAllDay(normalizedReminder, Boolean(options.allDay));
        }
        const customTime = getReminderCustomTime(normalizedReminder) || "18:00";
        const selectValue = getReminderSelectValue(normalizedReminder, itemType, options);

        selectElement.innerHTML = "";
        getReminderBaseOptions(itemType, options).forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          selectElement.appendChild(option);
        });

        const customOption = document.createElement("option");
        customOption.value = "自訂時間";
        customOption.textContent = "自訂時間";
        selectElement.appendChild(customOption);

        const resolvedSelectValue = selectValue;
        selectElement.value = resolvedSelectValue;
        if (selectElement.value !== resolvedSelectValue) {
          selectElement.selectedIndex = 0;
        }

        return { selectValue: resolvedSelectValue, customTime, normalizedReminder };
      }

      function normalizeReminderForType(reminder, targetType = "event") {
        const raw = String(reminder || "不提醒");
        if (targetType === "event") {
          if (["不提醒", "提前 10 分鐘", "提前 30 分鐘", "提前 1 小時", "提前 1 天", "提前 2 天"].includes(raw)) return raw;
          if (/^今天 \d{2}:\d{2}$/.test(raw)) return raw;
          if (raw === "截止日前一天 18:00") return "提前 1 天";
          if (raw === "截止日當天 09:00") return "今天 09:00";
          if (raw === "截止日當天 18:00") return "今天 18:00";
          if (/^截止日當天 \d{2}:\d{2}$/.test(raw)) return raw.replace("截止日當天 ", "今天 ");
          return "不提醒";
        }

        if (["不提醒", "截止日當天 09:00", "截止日當天 18:00", "截止日前一天 18:00"].includes(raw)) return raw;
        if (/^截止日當天 \d{2}:\d{2}$/.test(raw)) return raw;
        if (/^今天 \d{2}:\d{2}$/.test(raw)) return raw.replace("今天 ", "截止日當天 ");
        return "不提醒";
      }

      function createDateTime(isoDate, timeValue) {
        if (!isoDate || !timeValue) return null;
        const [year, month, day] = String(isoDate).split("-").map(Number);
        const [hour, minute] = String(timeValue).split(":").map(Number);
        if (![year, month, day, hour, minute].every(Number.isFinite)) return null;
        return new Date(year, month - 1, day, hour, minute, 0, 0);
      }

      function getReminderOffsetMinutes(reminder) {
        if (reminder === "提前 10 分鐘") return 10;
        if (reminder === "提前 30 分鐘") return 30;
        if (reminder === "提前 1 小時") return 60;
        if (reminder === "提前 1 天") return 24 * 60;
        if (reminder === "提前 2 天") return 48 * 60;
        return null;
      }

      function buildEventReminderEntry(item) {
        if (!item || item.reminder === "不提醒") return null;
        const customTime = getReminderCustomTime(item.reminder);
        const offsetMinutes = getReminderOffsetMinutes(item.reminder);
        let trigger = null;

        if (/^今天 \d{2}:\d{2}$/.test(String(item.reminder || ""))) {
          trigger = createDateTime(item.date, customTime);
        } else if (item.allDay && item.reminder === "提前 1 天") {
          trigger = createDateTime(addDays(item.date, -1), "09:00");
        } else if (item.allDay && item.reminder === "提前 2 天") {
          trigger = createDateTime(addDays(item.date, -2), "09:00");
        } else if (!item.allDay && item.startTime && offsetMinutes !== null) {
          const start = createDateTime(item.date, item.startTime);
          if (start) trigger = new Date(start.getTime() - offsetMinutes * 60 * 1000);
        }

        if (!trigger) return null;

        const endAt = item.allDay
          ? createDateTime(item.date, "23:59")
          : createDateTime(item.date, item.endTime || item.startTime || "23:59");

        return {
          key: `event:${item.id}:${item.date}:${item.reminder}`,
          kind: "event",
          title: item.title,
          whenLabel: item.allDay ? "全天" : `${item.startTime || "--:--"} - ${item.endTime || "--:--"}`,
          meta: `${item.category}${item.location ? ` · ${item.location}` : ""}`,
          triggerAt: trigger,
          expiresAt: endAt || new Date(trigger.getTime() + 2 * 60 * 60 * 1000)
        };
      }

      function buildTodoReminderEntry(item) {
        if (!item || item.reminder === "不提醒" || !item.dueDate) return null;
        let trigger = null;

        if (item.reminder === "截止日當天 09:00") {
          trigger = createDateTime(item.dueDate, "09:00");
        } else if (item.reminder === "截止日當天 18:00") {
          trigger = createDateTime(item.dueDate, "18:00");
        } else if (item.reminder === "截止日前一天 18:00") {
          trigger = createDateTime(addDays(item.dueDate, -1), "18:00");
        } else if (/^截止日當天 \d{2}:\d{2}$/.test(String(item.reminder || ""))) {
          trigger = createDateTime(item.dueDate, String(item.reminder).replace("截止日當天 ", ""));
        }

        if (!trigger) return null;

        return {
          key: `todo:${item.id}:${item.dueDate}:${item.reminder}`,
          kind: "todo",
          title: item.title,
          whenLabel: `截止 ${toSlashDate(item.dueDate)}`,
          meta: `${item.category}${item.location ? ` · ${item.location}` : ""}`,
          triggerAt: trigger,
          expiresAt: new Date(trigger.getTime() + 12 * 60 * 60 * 1000)
        };
      }

      function buildReminderNotificationContent(item) {
        const heading = item.kind === "todo"
          ? "待辦截止提醒"
          : item.whenLabel === "全天"
            ? "全天行程提醒"
            : "即將開始";
        const metaLines = [item.whenLabel, item.meta].filter(Boolean);
        return {
          title: `${heading}｜${item.title}`,
          body: metaLines.join("\n")
        };
      }

      function toScheduledReminderId(key) {
        let hash = 0;
        const source = String(key || "");
        for (let index = 0; index < source.length; index += 1) {
          hash = (hash * 31 + source.charCodeAt(index)) >>> 0;
        }
        return (hash % 2147483000) + 1;
      }

      function collectScheduledReminderEntries() {
        const now = new Date();
        const items = [
          ...getCalendarEvents(addDays(getCurrentIsoDate(), -1), addDays(getCurrentIsoDate(), 30)).map(buildEventReminderEntry),
          ...state.todos.map(buildTodoReminderEntry)
        ].filter(Boolean);

        return items
          .filter((item) => item.triggerAt instanceof Date && !Number.isNaN(item.triggerAt.getTime()))
          .filter((item) => item.triggerAt.getTime() > now.getTime())
          .map((item) => {
            const content = buildReminderNotificationContent(item);
            return {
              id: toScheduledReminderId(item.key),
              title: content.title,
              body: content.body,
              at: item.triggerAt.toISOString()
            };
          });
      }

      async function syncScheduledReminders() {
        if (typeof window.syncDesktopReminderNotifications !== "function") {
          desktopReminderScheduleActive = false;
          return;
        }

        const scheduled = collectScheduledReminderEntries();
        const signature = JSON.stringify(scheduled);
        if (signature === lastScheduledReminderSignature) return;

        lastScheduledReminderSignature = signature;
        desktopReminderScheduleActive = await window.syncDesktopReminderNotifications(scheduled);
      }

      function renderLiveReminders() {
        if (!elements.reminderRoot) return;
        if (activeReminders.length === 0) {
          elements.reminderRoot.innerHTML = "";
          return;
        }

        elements.reminderRoot.innerHTML = activeReminders.map((item) => `
          <article class="live-reminder-card" data-reminder-key="${item.key}">
            <p class="card-label">時間提醒</p>
            <h4>${item.title}</h4>
            <p class="subtle-meta">${item.whenLabel}</p>
            ${item.meta ? `<p class="subtle-meta" style="margin-top:0.35rem;">${item.meta}</p>` : ""}
            <div class="live-reminder-actions">
              <button class="ghost-button" type="button" data-reminder-dismiss="${item.key}">知道了</button>
            </div>
          </article>
        `).join("");
      }

      async function fireReminderNotification(item) {
        if (desktopReminderScheduleActive) return true;

        const content = buildReminderNotificationContent(item);

        if (typeof window.sendDesktopNotification === "function") {
          const sent = await window.sendDesktopNotification(content.title, content.body);
          if (sent) return true;
        }

        if (!("Notification" in window)) return false;
        if (Notification.permission === "granted") {
          new Notification(content.title, { body: content.body });
          return true;
        } else if (Notification.permission === "default") {
          return Notification.requestPermission().then((permission) => {
            if (permission === "granted") {
              new Notification(content.title, { body: content.body });
              return true;
            }
            return false;
          }).catch(() => false);
        }
        return false;
      }

      async function checkDueReminders() {
        const now = new Date();
        const candidates = [
          ...getCalendarEvents(addDays(getCurrentIsoDate(), -1), addDays(getCurrentIsoDate(), 1)).map(buildEventReminderEntry),
          ...state.todos.map(buildTodoReminderEntry)
        ].filter(Boolean);

        const nextDue = [];
        for (const item of candidates) {
          if (reminderHistory.has(item.key)) continue;
          if (now < item.triggerAt) continue;
          if (item.expiresAt && now > item.expiresAt) {
            reminderHistory.add(item.key);
            continue;
          }

          reminderHistory.add(item.key);
          const sent = await fireReminderNotification(item);
          if (!sent) {
            nextDue.push(item);
          }
        }

        if (nextDue.length > 0) {
          persistReminderHistory();
          activeReminders = [...nextDue, ...activeReminders].slice(0, 4);
          renderLiveReminders();
        }
      }

      function setActiveNav(key) {
        [
          ["calendar", elements.calendarNavButton],

      function getCategoryList(selected = "") {
        const base = Array.isArray(state.settings.categories) && state.settings.categories.length
          ? state.settings.categories
          : defaultState.settings.categories;
        const merged = selected && !base.includes(selected) ? [...base, selected] : [...base];
        return [...new Set(merged.map((item) => String(item).trim()).filter(Boolean))];
      }

      function resolveExistingCategory(category, categories) {
        const cleanList = Array.isArray(categories)
          ? [...new Set(categories.map((item) => String(item).trim()).filter(Boolean))]
          : [];
        if (!cleanList.length) return String(category || "工作");
        const candidate = String(category || "").trim();
        return cleanList.includes(candidate) ? candidate : cleanList[0];
      }

      function buildCategoryOptions(selected = "") {

      }

      function getCategoryColor(category) {

      }

      function getCategoryBadgeStyle(category) {

      }

      function buildCategoryMarkerDots(items, max = 4) {
        const categories = [...new Set(items.map((item) => item.category).filter(Boolean))].slice(0, max);
        if (categories.length === 0) return "";
        return `
          <div class="calendar-marker-row">
            ${categories.map((category) => `<span class="calendar-marker-dot" style="background:${getCategoryColor(category)};" title="${category}"></span>`).join("")}
