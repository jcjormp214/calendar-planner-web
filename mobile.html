                    <span>偏移</span>
                    <div class="process-offset-grid">
                      <select data-step-direction="${step.id}">
                        <option ${step.offsetDirection === "提前" ? "selected" : ""}>提前</option>
                        <option ${step.offsetDirection === "延後" ? "selected" : ""}>延後</option>
                      </select>
                      <input data-step-offset="${step.id}" type="number" min="0" max="31" value="${Number(step.offsetValue) || 0}" />
                      <select data-step-offset-unit="${step.id}">
                        <option ${step.offsetUnit === "天" ? "selected" : ""}>天</option>
                        <option ${step.offsetUnit === "工作天" ? "selected" : ""}>工作天</option>
                      </select>
                    </div>
                  </label>
                  <label class="field">
                    <span>開始時間</span>
                    <div class="time-picker" data-process-picker="${step.id}-start">
                      <input class="time-trigger" data-step-start-trigger="${step.id}" type="text" autocomplete="off" spellcheck="false" value="${formatTimeDisplay(step.startTime || "10:00")}" />
                      <div class="time-popup hidden" data-step-start-popup="${step.id}"></div>
                      <input data-step-start-time="${step.id}" type="hidden" value="${step.startTime || "10:00"}" />
                    </div>
                  </label>
                  <label class="field">
                    <span>結束時間</span>
                    <div class="time-picker" data-process-picker="${step.id}-end">
                      <input class="time-trigger" data-step-end-trigger="${step.id}" type="text" autocomplete="off" spellcheck="false" value="${formatTimeDisplay(step.endTime || "11:00")}" />
                      <div class="time-popup hidden" data-step-end-popup="${step.id}"></div>
                      <input data-step-end-time="${step.id}" type="hidden" value="${step.endTime || "11:00"}" />
                    </div>
                  </label>
                </div>
                <label class="field">
                  <span>提醒</span>
                  <select data-step-reminder="${step.id}">
                    ${buildEventReminderOptions(step.reminder || "不提醒")}
                  </select>
                </label>
              `}
              <label class="field">
                <span>備註</span>
                <textarea data-step-notes="${step.id}" rows="2">${step.notes || ""}</textarea>
              </label>
            </div>
          `;
        }
        const baseRule = existingRule || {
          title: "",
          category: defaultProcessCategory || "工作",
          monthlyDay: 20,
          startDate: TODAY,
          repeatEndDate: `${new Date().getFullYear()}-12-31`,
          noEndRepeat: false,
          holidayAction: "提前到前一工作日",
          steps: [
            { id: "main", title: "主事件", relation: "main", offsetValue: 0, offsetUnit: "天", startTime: "10:00", endTime: "11:00", reminder: "不提醒", category: defaultProcessCategory || "工作", notes: "" },
            { id: "step-1", title: "前置作業", relation: "before", offsetValue: 1, offsetUnit: "工作天", startTime: "09:00", endTime: "09:30", reminder: "不提醒", category: defaultProcessCategory || "工作", notes: "" }
          ]
        };

        elements.modalRoot.innerHTML = `
          <div class="modal-backdrop" id="modalBackdrop">
            <aside class="modal-panel" id="modalPanel">
              <div class="topbar">
                <div>
                  <p class="card-label">固定流程</p>
                  <h3>${existingRule ? "編輯固定流程" : "新增固定流程"}</h3>
                </div>
                <div class="topbar-actions">
                  ${existingRule ? `<button id="deleteProcessRuleButton" class="ghost-button" type="button">刪除</button>` : ""}
                  <button id="saveProcessRuleButton" class="primary-button" type="button">${existingRule ? "更新" : "儲存"}</button>
                  <button id="closeModalButton" class="ghost-button" type="button">關閉</button>
                </div>
              </div>

              <div class="form-stack">
                <div class="field-grid">
                  <label class="field">
                    <span>流程名稱</span>
                    <input id="processRuleTitle" autocomplete="off" value="${baseRule.title || ""}" />
                  </label>
                  <label class="field">
                    <span>分類</span>
                    <select id="processRuleCategory">${buildCategoryOptions(baseRule.category || "財務")}</select>
                  </label>
                </div>

                <div class="field-grid">
                  <label class="field">
                    <span>每月主事件日期</span>
                    <input id="processRuleMonthlyDay" type="number" min="1" max="31" value="${Number(baseRule.monthlyDay) || 20}" />
                  </label>
                  <label class="field">
                    <span>主事件遇假日</span>
                    <select id="processRuleHolidayAction">
                      <option ${(baseRule.holidayAction || "提前到前一工作日") === "不調整" ? "selected" : ""}>不調整</option>
                      <option ${(baseRule.holidayAction || "提前到前一工作日") === "提前到前一工作日" ? "selected" : ""}>提前到前一工作日</option>
                      <option ${(baseRule.holidayAction || "提前到前一工作日") === "延後到下一工作日" ? "selected" : ""}>延後到下一工作日</option>
                    </select>
                  </label>
                </div>

                <div class="field-grid">
                  <label class="field">
                    <span>開始日期</span>
                    <div class="date-input-group">
                      <input id="processRuleStartDate" type="text" placeholder="YYYY/MM/DD" value="${toSlashDate(baseRule.startDate || TODAY)}" />
                      <input id="processRuleStartDatePicker" class="date-picker-native" type="date" value="${baseRule.startDate || TODAY}" />
                    </div>
                  </label>
                  <label class="field">
                    <span>重複至</span>
                    <div class="date-input-group">
                      <input id="processRuleEndDate" type="text" placeholder="YYYY/MM/DD" value="${toSlashDate(baseRule.repeatEndDate || "")}" />
                      <input id="processRuleEndDatePicker" class="date-picker-native" type="date" value="${baseRule.repeatEndDate || ""}" />
                    </div>
                  </label>
                </div>

                  <section class="settings-section" style="margin:0; padding:1rem 1.05rem;">
                    <div class="section-header" style="padding-right:1rem; padding-bottom:0.45rem;">
                      <p class="card-label">流程步驟</p>
                      <button id="addProcessStepButton" class="ghost-button" type="button" style="margin-right:1.05rem;">新增步驟</button>
                    </div>
                    <div id="processStepsList" class="form-stack">
                    ${baseRule.steps.map((step, index) => buildProcessStepCardMarkup(step, index, baseRule.steps)).join("")}
                  </div>
                </section>
              </div>
            </aside>
          </div>
        `;

        const modalBackdrop = document.getElementById("modalBackdrop");
        const modalPanel = document.getElementById("modalPanel");
        const stepsList = document.getElementById("processStepsList");
        wireDatePickerField(document.getElementById("processRuleStartDate"), document.getElementById("processRuleStartDatePicker"));
        wireDatePickerField(document.getElementById("processRuleEndDate"), document.getElementById("processRuleEndDatePicker"));

        function refreshProcessStepLabels() {
          Array.from(stepsList.querySelectorAll("[data-process-step]")).forEach((node, index) => {
            const stepId = node.getAttribute("data-process-step");
            const label = node.querySelector(`[data-step-label="${stepId}"]`);
            if (!(label instanceof HTMLElement)) return;
            if (index === 0) {
              label.textContent = "主事件";
              return;
            }
            const direction = node.querySelector(`[data-step-direction="${stepId}"]`)?.value || "提前";
            label.textContent = getProcessStepLabelByIndex(index, "before", direction);
          });
        }

        function refreshProcessStepAnchors() {
          const stepNodes = Array.from(stepsList.querySelectorAll("[data-process-step]"));
          stepNodes.forEach((node, index) => {
            if (index === 0) return;
            const stepId = node.getAttribute("data-process-step");
            const anchorSelect = node.querySelector(`[data-step-anchor="${stepId}"]`);
            if (!(anchorSelect instanceof HTMLSelectElement)) return;
            const previousValue = anchorSelect.value || "main";
            const options = ['<option value="main">主事件</option>'];
            for (let i = 1; i < index; i += 1) {
              const priorNode = stepNodes[i];
              const priorId = priorNode.getAttribute("data-process-step");
              if (!priorId) continue;
              options.push(`<option value="${priorId}">前置步驟 ${i}</option>`);
            }
            anchorSelect.innerHTML = options.join("");
            anchorSelect.value = options.some((markup) => markup.includes(`value="${previousValue}"`)) ? previousValue : "main";
          });
        }

        const closeProcessRuleModal = () => {
          closeModal();
          openRecurringModal();
        };

        modalBackdrop.addEventListener("click", closeProcessRuleModal);
        modalPanel.addEventListener("click", (event) => event.stopPropagation());
        document.getElementById("closeModalButton").addEventListener("click", closeProcessRuleModal);
        document.getElementById("deleteProcessRuleButton")?.addEventListener("click", () => {
          if (!existingRule) return;
          if (!window.confirm(`確定要刪除固定流程「${existingRule.title}」嗎？`)) return;
          captureUndoState();
          state.processRules = state.processRules.filter((item) => String(item.id) !== String(existingRule.id));
          persist();
          closeProcessRuleModal();
          render();
        });

        function bindStepRemovers() {
          stepsList.querySelectorAll("[data-remove-process-step]").forEach((button) => {
            button.addEventListener("click", () => {
              button.closest("[data-process-step]")?.remove();
              refreshProcessStepLabels();
              refreshProcessStepAnchors();
            });
          });
          stepsList.querySelectorAll("[data-step-direction]").forEach((select) => {
            select.addEventListener("change", refreshProcessStepLabels);
          });
        }

        document.getElementById("addProcessStepButton").addEventListener("click", () => {
          const stepId = `step-${Date.now()}`;
          const temp = document.createElement("div");
          const draftSteps = Array.from(stepsList.querySelectorAll("[data-process-step]")).map((node, index) => ({
            id: node.getAttribute("data-process-step") || `step-${index}`,
            relation: index === 0 ? "main" : "before",
            offsetDirection: node.querySelector(`[data-step-direction="${node.getAttribute("data-process-step")}"]`)?.value || "提前"
          }));
          const newStepDraft = {
            id: stepId,
            title: "",
            category: document.getElementById("processRuleCategory").value || "財務",
            relation: "before",
            anchorStepId: "main",
            offsetDirection: "提前",
            offsetValue: 1,
            offsetUnit: "工作天",
            startTime: "09:00",
            endTime: "09:30",
            notes: ""
          };
          temp.innerHTML = buildProcessStepCardMarkup(
            newStepDraft,
            stepsList.querySelectorAll("[data-process-step]").length,
            [...draftSteps, newStepDraft]
          );
          const wrapper = temp.firstElementChild;
          if (!wrapper) return;
          stepsList.appendChild(wrapper);
          bindStepRemovers();
          refreshProcessStepLabels();
          refreshProcessStepAnchors();
          bindProcessTimeDisplayInputs(wrapper);
          refreshProcessEndTime(stepId);
        });
        bindStepRemovers();
        refreshProcessStepLabels();
        refreshProcessStepAnchors();

        function getProcessPickerParts(stepId, pickerType) {
          return {
            input: stepsList.querySelector(`[data-step-${pickerType}-time="${stepId}"]`),
            trigger: stepsList.querySelector(`[data-step-${pickerType}-trigger="${stepId}"]`),
            popup: stepsList.querySelector(`[data-step-${pickerType}-popup="${stepId}"]`),
            fallback: pickerType === "start" ? "10:00" : "11:00"
          };
        }

        function processTimeMinuteDisabled(stepId, pickerType, period, hour, minute) {
          if (pickerType !== "end") return false;
          const startInput = stepsList.querySelector(`[data-step-start-time="${stepId}"]`);
          if (!(startInput instanceof HTMLInputElement)) return false;
          const candidate = joinTimeParts(period, hour, minute);
          return parseTimeValue(candidate) <= parseTimeValue(startInput.value || "10:00");
        }

        function processTimeHourValid(stepId, pickerType, period, hour) {
          if (pickerType !== "end") return true;
          return TIME_MINUTE_OPTIONS.some((minute) => {
            return !processTimeMinuteDisabled(stepId, pickerType, period, hour, minute);
          });
        }

        function normalizeProcessTimeParts(stepId, pickerType, parts) {
          if (pickerType !== "end") return parts;
          if (processTimeHourValid(stepId, pickerType, parts.period, parts.hour) && !processTimeMinuteDisabled(stepId, pickerType, parts.period, parts.hour, parts.minute)) {
            return parts;
          }
          const periods = [parts.period, ...(parts.period === "上午" ? ["下午"] : ["上午"])];
          const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
          const minutes = TIME_MINUTE_OPTIONS;
          for (const period of periods) {
            for (const hour of hours) {
              if (!processTimeHourValid(stepId, pickerType, period, hour)) continue;
              for (const minute of minutes) {
                if (!processTimeMinuteDisabled(stepId, pickerType, period, hour, minute)) {
                  return { period, hour, minute };
                }
              }
            }
          }
          return parts;
        }

        function closeProcessTimePopups() {
          stepsList.querySelectorAll(".time-popup").forEach((popup) => popup.classList.add("hidden"));
        }

        function renderProcessTimePopup(stepId, pickerType) {
          const picker = getProcessPickerParts(stepId, pickerType);
          if (!(picker.input instanceof HTMLInputElement) || !(picker.popup instanceof HTMLElement)) return;
          const parts = splitTimeParts(picker.input.value || picker.fallback);
          const periods = ["上午", "下午"];
          const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
          const minutes = TIME_MINUTE_OPTIONS;
          picker.popup.innerHTML = `
            <div class="time-column">
              ${periods.map((period) => `<button class="time-option ${parts.period === period ? "active" : ""}" data-process-step-time="${stepId}" data-picker="${pickerType}" data-part="period" data-value="${period}" type="button">${period}</button>`).join("")}
            </div>
            <div class="time-column">
              ${hours.map((hour) => `<button class="time-option ${parts.hour === hour ? "active" : ""}" data-process-step-time="${stepId}" data-picker="${pickerType}" data-part="hour" data-value="${hour}" type="button" ${pickerType === "end" && !processTimeHourValid(stepId, pickerType, parts.period, hour) ? "disabled" : ""}>${hour}</button>`).join("")}
            </div>
            <div class="time-column">
              ${minutes.map((minute) => `<button class="time-option ${parts.minute === minute ? "active" : ""}" data-process-step-time="${stepId}" data-picker="${pickerType}" data-part="minute" data-value="${minute}" type="button" ${processTimeMinuteDisabled(stepId, pickerType, parts.period, parts.hour, minute) ? "disabled" : ""}>${minute}</button>`).join("")}
            </div>
          `;
        }

        function refreshProcessEndTime(stepId) {
          const startInput = stepsList.querySelector(`[data-step-start-time="${stepId}"]`);
          const endInput = stepsList.querySelector(`[data-step-end-time="${stepId}"]`);
          const endTrigger = stepsList.querySelector(`[data-step-end-trigger="${stepId}"]`);
          if (!(startInput instanceof HTMLInputElement) || !(endInput instanceof HTMLInputElement) || !(endTrigger instanceof HTMLElement)) return;
          const available = getAvailableEndTimes(startInput.value || "10:00");
          if (!endInput.value || parseTimeValue(endInput.value) <= parseTimeValue(startInput.value || "10:00")) {
            endInput.value = available[0] || minutesToTime(parseTimeValue(startInput.value || "10:00") + 1);
          }
          setTimeTriggerValue(endTrigger, endInput.value);
        }

        function bindProcessTimeDisplayInputs(root = stepsList) {
          const stepNodes = root.matches?.("[data-process-step]")
            ? [root]
            : Array.from(root.querySelectorAll("[data-process-step]"));
          stepNodes.forEach((node) => {
            const stepId = node.getAttribute("data-process-step");
            if (!stepId) return;
            bindTimeDisplayInput(
              node.querySelector(`[data-step-start-trigger="${stepId}"]`),
              node.querySelector(`[data-step-start-time="${stepId}"]`),
              {
                openPopup: () => {
                  const popup = stepsList.querySelector(`[data-step-start-popup="${stepId}"]`);
                  const hidden = popup?.classList.contains("hidden");
                  closeProcessTimePopups();
                  if (hidden) {
                    renderProcessTimePopup(stepId, "start");
                    popup?.classList.remove("hidden");
                  }
                },
                onValidChange: () => {
                  refreshProcessEndTime(stepId);
                  const endPopup = stepsList.querySelector(`[data-step-end-popup="${stepId}"]`);
                  if (!endPopup?.classList.contains("hidden")) renderProcessTimePopup(stepId, "end");
                }
              }
            );
            bindTimeDisplayInput(
              node.querySelector(`[data-step-end-trigger="${stepId}"]`),
              node.querySelector(`[data-step-end-time="${stepId}"]`),
              {
                openPopup: () => {
                  const popup = stepsList.querySelector(`[data-step-end-popup="${stepId}"]`);
                  const hidden = popup?.classList.contains("hidden");
                  closeProcessTimePopups();
                  if (hidden) {
                    renderProcessTimePopup(stepId, "end");
                    popup?.classList.remove("hidden");
                  }
                }
              }
            );
          });
        }

        bindProcessTimeDisplayInputs();

        stepsList.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const trigger = target.closest("button[data-step-start-trigger], button[data-step-end-trigger]");
          if (trigger) {
            const isStart = trigger.hasAttribute("data-step-start-trigger");
            const stepId = trigger.getAttribute(isStart ? "data-step-start-trigger" : "data-step-end-trigger");
            if (!stepId) return;
            const popup = stepsList.querySelector(`[data-step-${isStart ? "start" : "end"}-popup="${stepId}"]`);
            const hidden = popup?.classList.contains("hidden");
            closeProcessTimePopups();
            if (hidden) {
              renderProcessTimePopup(stepId, isStart ? "start" : "end");
              popup?.classList.remove("hidden");
            }
            return;
          }

          const option = target.closest("[data-process-step-time]");
          if (option) {
            const stepId = option.getAttribute("data-process-step-time");
            const pickerType = option.getAttribute("data-picker");
            const part = option.getAttribute("data-part");
            const value = option.getAttribute("data-value");
            if (!stepId || !pickerType || !part || !value) return;
            const picker = getProcessPickerParts(stepId, pickerType);
            if (!(picker.input instanceof HTMLInputElement) || !(picker.trigger instanceof HTMLElement)) return;
            const parts = splitTimeParts(picker.input.value || picker.fallback);
            parts[part] = value;
            const safeParts = normalizeProcessTimeParts(stepId, pickerType, parts);
            picker.input.value = joinTimeParts(safeParts.period, safeParts.hour, safeParts.minute);
            setTimeTriggerValue(picker.trigger, picker.input.value);
            if (pickerType === "start") {
              refreshProcessEndTime(stepId);
              renderProcessTimePopup(stepId, "end");
            }
            renderProcessTimePopup(stepId, pickerType);
            if (part === "minute") closeProcessTimePopups();
            return;
          }

          if (!target.closest(".time-picker")) closeProcessTimePopups();
        });

        document.getElementById("saveProcessRuleButton").addEventListener("click", () => {
          const title = document.getElementById("processRuleTitle").value.trim();
          const category = document.getElementById("processRuleCategory").value;
          const monthlyDay = Number(document.getElementById("processRuleMonthlyDay").value) || 20;
          const startDate = normalizeDateInputValue(document.getElementById("processRuleStartDate").value);
          const repeatEndDate = normalizeDateInputValue(document.getElementById("processRuleEndDate").value);
          const holidayAction = document.getElementById("processRuleHolidayAction").value;
          const stepNodes = Array.from(stepsList.querySelectorAll("[data-process-step]"));
          const steps = stepNodes.map((node, index) => {
            const id = node.getAttribute("data-process-step");

            const endDisplay = node.querySelector(`[data-step-end-trigger="${id}"]`);
            const normalizedStepStartTime = normalizeTimeInputValue(startDisplay?.value);
            const normalizedStepEndTime = normalizeTimeInputValue(endDisplay?.value);
            return {
              id,
              title: node.querySelector(`[data-step-title="${id}"]`)?.value?.trim() || (index === 0 ? "主事件" : `步驟 ${index}`),
              category,
              relation: index === 0 ? "main" : "before",
              anchorStepId: index === 0 ? "main" : (node.querySelector(`[data-step-anchor="${id}"]`)?.value || "main"),
              offsetDirection: index === 0 ? "提前" : (node.querySelector(`[data-step-direction="${id}"]`)?.value || "提前"),
              offsetValue: index === 0 ? 0 : (Number(node.querySelector(`[data-step-offset="${id}"]`)?.value) || 0),
              offsetUnit: index === 0 ? "天" : (node.querySelector(`[data-step-offset-unit="${id}"]`)?.value || "工作天"),
              startTime: normalizedStepStartTime || node.querySelector(`[data-step-start-time="${id}"]`)?.value || "10:00",
              endTime: normalizedStepEndTime || node.querySelector(`[data-step-end-time="${id}"]`)?.value || "11:00",
              reminder: node.querySelector(`[data-step-reminder="${id}"]`)?.value || "不提醒",
              notes: node.querySelector(`[data-step-notes="${id}"]`)?.value?.trim() || ""
            };
          });

          if (!title || !startDate || !repeatEndDate || steps.length === 0) {
            window.alert("請先填寫流程名稱、開始日期、重複至，以及至少一個步驟。");
            return;
          }
          captureUndoState();

          const nextRule = {
            id: existingRule?.id || generateId(),
            title,
            category,
            monthlyDay,
            startDate,
            repeatEndDate,
            noEndRepeat: false,
            holidayAction,
            steps
          };

          if (existingRule) {
            state.processRules = state.processRules.map((item) => (String(item.id) === String(existingRule.id) ? nextRule : item));
          } else {
            state.processRules.unshift(nextRule);

          persist();
          closeProcessRuleModal();
          render();
        });

        Array.from(stepsList.querySelectorAll("[data-process-step]")).forEach((node) => {
          const stepId = node.getAttribute("data-process-step");
          if (!stepId) return;
          refreshProcessEndTime(stepId);
        });
      }

        const modalDateInput = document.getElementById("modalDate");
        const modalEndDateInput = document.getElementById("modalEndDate");
        const modalEndDatePicker = document.getElementById("modalEndDatePicker");
        let previousStartDate = normalizeDateInputValue(modalDateInput?.value || "");
        const syncEventEndDate = () => {
          const nextStartDate = normalizeDateInputValue(modalDateInput?.value || "");
          if (!nextStartDate || !(modalEndDateInput instanceof HTMLInputElement) || !(modalEndDatePicker instanceof HTMLInputElement)) return;

          const currentEndDate = normalizeDateInputValue(modalEndDateInput.value);
          let nextEndDate = nextStartDate;
          if (previousStartDate && currentEndDate) {
            const daysShift = Math.round((createLocalDate(nextStartDate) - createLocalDate(previousStartDate)) / (1000 * 60 * 60 * 24));
            nextEndDate = addDays(currentEndDate, daysShift);
          }
          if (nextEndDate < nextStartDate) nextEndDate = nextStartDate;

          modalEndDateInput.value = toSlashDate(nextEndDate);
          modalEndDatePicker.value = nextEndDate;
          previousStartDate = nextStartDate;
        };
        modalDateInput?.addEventListener("input", syncEventEndDate);
        modalDateInput?.addEventListener("change", syncEventEndDate);

        function refreshEndOptions() {
          if (!(modalStart instanceof HTMLInputElement) || !(modalEnd instanceof HTMLInputElement)) return;
          const startTime = modalStart.value || "15:00";
          const available = getAvailableEndTimes(startTime);
          const minEndTime = available[0] || minutesToTime(parseTimeValue(startTime) + 1);
          if (!modalEnd.value || parseTimeValue(modalEnd.value) <= parseTimeValue(startTime)) {
            modalEnd.value = minEndTime;
          }
          setTimeTriggerValue(modalEndTrigger, modalEnd.value);
        }

        function getPickerParts(pickerType) {
          if (pickerType === "start") return { input: modalStart, trigger: modalStartTrigger, popup: modalStartPopup, fallback: "15:00" };
          if (pickerType === "end") return { input: modalEnd, trigger: modalEndTrigger, popup: modalEndPopup, fallback: "16:00" };
          return { input: modalCustomReminderTime, trigger: modalCustomReminderTrigger, popup: modalCustomReminderPopup, fallback: "18:00" };
        }

        function closeTimePopups() {
          modalStartPopup.classList.add("hidden");
          modalEndPopup.classList.add("hidden");
          modalCustomReminderPopup.classList.add("hidden");
        }

        function renderTimePopup(pickerType) {
          const picker = getPickerParts(pickerType);
          const popup = picker.popup;
          const input = picker.input;
          const baseTime = input.value || picker.fallback;
          const parts = splitTimeParts(baseTime);
          const previousScroll = Array.from(popup.querySelectorAll(".time-column")).map((column) => column.scrollTop);

          const periods = ["上午", "下午"];
          const hours = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, "0"));
          const minutes = TIME_MINUTE_OPTIONS;

          popup.innerHTML = `
            <div class="time-column">
              ${periods.map((period) => `
                <button
                  class="time-option ${parts.period === period ? "active" : ""}"
                  data-picker="${pickerType}"
                  data-part="period"
                  data-value="${period}"
                  type="button"
                  ${!hasValidPeriodOption(pickerType, period) ? "disabled" : ""}
                >${period}</button>
              `).join("")}
            </div>
            <div class="time-column">
              ${hours.map((hour) => `
                <button
                  class="time-option ${parts.hour === hour ? "active" : ""}"
                  data-picker="${pickerType}"
                  data-part="hour"
                  data-value="${hour}"
                  type="button"
                  ${!hasValidHourOption(pickerType, parts.period, hour) ? "disabled" : ""}
                >${hour}</button>
              `).join("")}
            </div>
            <div class="time-column">
              ${minutes.map((minute) => {
                const disabled = isMinuteDisabled(pickerType, parts.period, parts.hour, minute);
                return `<button class="time-option ${parts.minute === minute ? "active" : ""}" data-picker="${pickerType}" data-part="minute" data-value="${minute}" type="button" ${disabled ? "disabled" : ""}>${minute}</button>`;
              }).join("")}
            </div>
          `;

          Array.from(popup.querySelectorAll(".time-column")).forEach((column, index) => {
            if (typeof previousScroll[index] === "number") {
              column.scrollTop = previousScroll[index];
              return;
            }
            const active = column.querySelector(".time-option.active");
            if (active instanceof HTMLElement) {
              active.scrollIntoView({ block: "center" });
            }
          });
        }

        function updateTimeValue(pickerType, part, value) {
          const picker = getPickerParts(pickerType);
          const input = picker.input;
          const trigger = picker.trigger;
          const parts = splitTimeParts(input.value || picker.fallback);
          parts[part] = value;
          if (part === "period" && !hasValidPeriodOption(pickerType, value)) return;
          if (part === "hour" && !hasValidHourOption(pickerType, parts.period, value)) return;
          if (part === "minute" && isMinuteDisabled(pickerType, parts.period, parts.hour, value)) return;
          const safeParts = normalizePickerParts(pickerType, parts);
          const nextValue = joinTimeParts(safeParts.period, safeParts.hour, safeParts.minute);
          input.value = nextValue;
          setTimeTriggerValue(trigger, nextValue);

          if (pickerType === "start") {
            refreshEndOptions();
            renderTimePopup("end");
          }

          renderTimePopup(pickerType);
          if (part === "minute") {
            closeTimePopups();
          }
        }

        function refreshEventFields() {
          modalEventFields.classList.toggle("hidden", modalAllDay.checked || modalPanel.dataset.itemType === "todo");
        }

        function refreshReminderOptions() {
          const itemType = modalPanel.dataset.itemType || "event";
          const reminderSource = getModalReminderValue();
          const customReminderTime = modalCustomReminderTime.value || getReminderCustomTime(reminderSource) || "18:00";
          const populated = populateReminderSelect(
            modalReminder,
            itemType,
            reminderSource,
            { allDay: itemType === "event" && modalAllDay.checked }
          );
          modalCustomReminderTime.value = customReminderTime;
          setTimeTriggerValue(modalCustomReminderTrigger, customReminderTime);
          if (modalReminder.value !== populated.selectValue) {
            modalReminder.value = populated.selectValue;
          }
          updateReminderCustomOptionLabel(itemType);
          syncCustomReminderField();
        }

        function getModalReminderValue() {
          const itemType = modalPanel.dataset.itemType || "event";
          if (modalReminder.value === "自訂時間" || isCustomReminderValue(modalReminder.value, itemType)) {
            const customTime = modalCustomReminderTime.value || getReminderCustomTime(modalReminder.value) || "18:00";
            return getCustomReminderLiteral(itemType, customTime);
          }
          return modalReminder.value;
        }

        function updateReminderCustomOptionLabel(nextType) {
          if (!(modalReminder instanceof HTMLSelectElement)) return;
          const customOption = Array.from(modalReminder.options).find((option) => option.value === "自訂時間")
            || Array.from(modalReminder.options).find((option) => isCustomReminderValue(option.value, nextType));
          if (!customOption) return;
          customOption.value = "自訂時間";
          customOption.text = "自訂時間";
          if (isCustomReminderValue(modalReminder.value, nextType)) {
            modalReminder.value = "自訂時間";
          }
        }

        function setModalType(nextType, sourceReminder = null) {
          const normalizedReminder = normalizeReminderForType(sourceReminder ?? getModalReminderValue(), nextType);
          const customReminderTime = getReminderCustomTime(normalizedReminder) || modalCustomReminderTime.value || "18:00";
          modalPanel.dataset.itemType = nextType;
          modalEventSegment.classList.toggle("active", nextType === "event");
          modalTodoSegment.classList.toggle("active", nextType === "todo");
          modalDateCategoryGrid.classList.toggle("event-date-grid", nextType === "event");
          modalAllDayWrap.classList.toggle("hidden", nextType === "todo");
          modalDateField.classList.toggle("hidden", nextType === "todo");
          modalEndDateField.classList.toggle("hidden", nextType === "todo");
          modalTodoDueDateField.classList.toggle("hidden", nextType === "event");
          modalReminderLabel.textContent = nextType === "event" ? "提醒" : "待辦提醒";
          modalLocationLabel.textContent = nextType === "event" ? "地點" : "卡片摘要";
          modalNotesLabel.textContent = nextType === "event" ? "備註" : "詳細備註";
          const populated = populateReminderSelect(
            modalReminder,
            nextType,
            normalizedReminder,
            { allDay: nextType === "event" && modalAllDay.checked }
          );
          modalCustomReminderTime.value = customReminderTime;
          setTimeTriggerValue(modalCustomReminderTrigger, customReminderTime);
          if (modalReminder.value !== populated.selectValue) {
            modalReminder.value = populated.selectValue;
          }
          updateReminderCustomOptionLabel(nextType);
          refreshEventFields();
          syncCustomReminderField();
        }

        function syncCustomReminderField() {
          const itemType = modalPanel.dataset.itemType || "event";
          modalCustomReminderWrap.classList.toggle("hidden", !(modalReminder.value === "自訂時間" || isCustomReminderValue(modalReminder.value, itemType)));
          updateReminderCustomOptionLabel(modalPanel.dataset.itemType || "event");
        }

        populateReminderSelect(
          document.getElementById("modalReminder"),
          itemType,
          normalizedItemReminder,
          { allDay: itemType === "event" && item.allDay }
        );
        setModalType(itemType, item.reminder);
        refreshEndOptions();
        setTimeTriggerValue(modalStartTrigger, modalStart.value || "15:00");
        setTimeTriggerValue(modalEndTrigger, modalEnd.value || "16:00");
        setTimeTriggerValue(modalCustomReminderTrigger, modalCustomReminderTime.value || "18:00");

        function openModalTimePopup(pickerType) {
          const popup = pickerType === "start" ? modalStartPopup : pickerType === "end" ? modalEndPopup : modalCustomReminderPopup;
          const isHidden = popup.classList.contains("hidden");
          closeTimePopups();
          if (isHidden) {
            renderTimePopup(pickerType);
            popup.classList.remove("hidden");
          }
        }

        bindTimeDisplayInput(modalStartTrigger, modalStart, {
          openPopup: () => openModalTimePopup("start"),
          onValidChange: () => {
            refreshEndOptions();
            if (!modalEndPopup.classList.contains("hidden")) renderTimePopup("end");
          }
        });
        bindTimeDisplayInput(modalEndTrigger, modalEnd, {
          openPopup: () => openModalTimePopup("end")
        });
        bindTimeDisplayInput(modalCustomReminderTrigger, modalCustomReminderTime, {
          openPopup: () => openModalTimePopup("custom")
        });

        const handleCloseComposer = () => {
          const overlay = returnToOverlay;
          returnToOverlay = null;
          closeModal();
          reopenOverlay(overlay);
        };

        modalEventSegment.addEventListener("click", () => setModalType("event"));
        modalTodoSegment.addEventListener("click", () => setModalType("todo"));
        modalReminder.addEventListener("change", syncCustomReminderField);
        modalBackdrop.addEventListener("click", handleCloseComposer);
        modalPanel.addEventListener("click", (event) => event.stopPropagation());
        document.getElementById("closeModalButton").addEventListener("click", handleCloseComposer);
        modalPanel.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const option = target.closest(".time-option");
          if (option) {
            const pickerType = option.dataset.picker;
            const part = option.dataset.part;
            const value = option.dataset.value;
            if (!pickerType || !part || !value) return;
            updateTimeValue(pickerType, part, value);
            return;
          }
          if (!target.closest(".time-picker")) {
            closeTimePopups();
          }
        });
        modalAllDay.addEventListener("change", () => {
          refreshEventFields();
          refreshReminderOptions();
        });

        modalPanel.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            handleCloseComposer();
          }
        });

        document.getElementById("modalSaveButton").addEventListener("click", async () => {
          const normalizedModalStart = normalizeTimeInputValue(modalStartTrigger.value);
          const normalizedModalEnd = normalizeTimeInputValue(modalEndTrigger.value);
          const normalizedModalCustomReminder = normalizeTimeInputValue(modalCustomReminderTrigger.value);
          if (normalizedModalStart) modalStart.value = normalizedModalStart;
          if (normalizedModalEnd) modalEnd.value = normalizedModalEnd;
          if (normalizedModalCustomReminder) modalCustomReminderTime.value = normalizedModalCustomReminder;
          const nextType = modalPanel.dataset.itemType;
          const nextTitle = document.getElementById("modalTitle").value.trim();
          const nextCategory = document.getElementById("modalCategory").value;
          const nextPriority = document.getElementById("modalPriority").value;
          const nextLocation = document.getElementById("modalLocation").value.trim();
          const nextNotes = document.getElementById("modalNotes").value.trim();

          if (!nextTitle) {
            window.alert("請先輸入標題。");
            return;
          }

          const isEditingEvent = state.editing?.kind === "event";
          const isEditingTodo = state.editing?.kind === "todo";

          if (nextType === "event") {
            const nextDate = normalizeDateInputValue(document.getElementById("modalDate").value);
            const nextEndDate = normalizeDateInputValue(document.getElementById("modalEndDate").value);
            if (!nextDate) {
              window.alert("行程需要開始日期，請輸入正確日期，格式為 YYYY/MM/DD。");
              return;
            }
            if (!nextEndDate || nextEndDate < nextDate) {
              window.alert("結束日期不能早於開始日期。");
              return;
            }

            if (nextDate < (state.currentDayMarker || getCurrentIsoDate())) {
              const shouldContinue = await showActionDialog({
                title: "確認過去日期",
                message: `你選的是過去日期 ${nextDate}，是否仍要繼續儲存？`,
                actions: [{ label: "仍然儲存", value: "continue" }],
                cancelText: "返回修改"
              });
              if (!shouldContinue) return;
            }

            const isAllDay = modalAllDay.checked;
            const nextStart = modalStart.value;
            const nextEnd = modalEnd.value;
            const editingEventId = isEditingEvent ? state.editing.id : null;
            const nextReminderSelect = document.getElementById("modalReminder").value;
            const rawNextReminder = (nextReminderSelect === "自訂時間" || isCustomReminderValue(nextReminderSelect, nextType))
              ? getCustomReminderLiteral(
                nextType,
                document.getElementById("modalCustomReminderTime").value
                || getReminderCustomTime(nextReminderSelect)
                || "18:00"
              )
              : nextReminderSelect;
            const nextReminder = normalizeEventReminderByAllDay(rawNextReminder, isAllDay);

            if (!isAllDay && parseTimeValue(nextEnd) <= parseTimeValue(nextStart)) {
              window.alert("結束時間必須晚於開始時間。");
              refreshEndOptions();
              return;
            }

            if (hasConflict(editingEventId, nextDate, nextEndDate, nextStart, nextEnd, isAllDay)) {
              const shouldContinue = await showActionDialog({
                title: "行程時間重疊",
                message: "這個時段和既有行程重疊，是否仍要儲存？",
                actions: [{ label: "仍然儲存", value: "continue" }],
                cancelText: "返回修改"
              });
              if (!shouldContinue) return;
            }

            const isGeneratedRecurringOccurrence = state.editing?.kind === "generated-recurring-event";
            const isGeneratedProcessOccurrence = state.editing?.kind === "generated-process-event";
            const nextEvent = {
              id: isEditingEvent ? state.editing.id : generateId(),
              title: nextTitle,
              date: nextDate,
              endDate: nextEndDate,
              startTime: isAllDay ? "" : nextStart,
              endTime: isAllDay ? "" : nextEnd,
              allDay: isAllDay,
              category: nextCategory,
              priority: nextPriority,
              reminder: nextReminder,
              location: nextLocation,
              notes: nextNotes
            };
            captureUndoState();

            if (isEditingEvent) {
              state.events = state.events.map((item) => (String(item.id) === String(state.editing.id) ? nextEvent : item));
            } else if (isGeneratedRecurringOccurrence) {
              const recurringDecision = await showActionDialog({
                title: "修改固定行程",
                message: "請選擇這次修改要套用到哪個範圍。",
                actions: [
                  { label: "更新之後全部", value: "future" },
                  { label: "只修改這一天", value: "single", variant: "subtle" }
                ],
                cancelText: "取消"
              });
              if (!recurringDecision) return;
              if (recurringDecision === "future") {
                state.recurringRules = state.recurringRules.map((rule) => (
                  String(rule.id) === String(state.editing.sourceRuleId)
                    ? {
                      ...rule,
                      title: nextTitle,
                      startDate: nextDate,
                      monthDay: Number(nextDate.slice(8, 10)) || rule.monthDay,
                      anchorMonth: nextDate.slice(5, 7),
                      nthWeek: getNthWeekLabel(nextDate),
                      weekday: getWeekdayLabel(nextDate),
                      startTime: isAllDay ? rule.startTime : nextStart,
                      endTime: isAllDay ? rule.endTime : nextEnd,
                      reminder: nextReminder,
                      category: nextCategory,
                      notes: nextNotes
                    }
                    : rule
                ));
              } else {
                state.events = [{
                  ...nextEvent,
                  sourceRuleId: state.editing.sourceRuleId
                }, ...state.events];
                state.recurringRules = state.recurringRules.map((rule) => (
                  String(rule.id) === String(state.editing.sourceRuleId)
                    ? { ...rule, skipDates: [...new Set([...(rule.skipDates || []), state.editing.originalDate])] }
                    : rule
                ));
              }
            } else if (isGeneratedProcessOccurrence) {
              const processDecision = await showActionDialog({
                title: "修改固定流程",
                message: "請選擇這次修改要只影響當天，還是更新之後的安排。",
                actions: [
                  { label: "更新之後全部", value: "future" },
                  { label: "只修改這一天", value: "single", variant: "subtle" }
                ],
                cancelText: "取消"
              });
              if (!processDecision) return;
              if (processDecision === "future") {
                state.processRules = state.processRules.map((rule) => {
                  if (String(rule.id) !== String(state.editing.sourceProcessRuleId)) return rule;
                  const nextSteps = (rule.steps || []).map((step) => {
                    if (String(step.id) !== String(state.editing.sourceProcessStepId)) return step;
                    const nextStep = {
                      ...step,
                      title: nextTitle,
                      startTime: isAllDay ? step.startTime : nextStart,
                      endTime: isAllDay ? step.endTime : nextEnd,
                      reminder: nextReminder,
                      notes: nextNotes
                    };
                    if (step.relation === "main") return nextStep;
                    const context = findProcessOccurrenceContext(rule, step.id, state.editing.originalDate);
                    if (!context) return nextStep;
                    const anchorDate = context.stepDateMap[step.anchorStepId || "main"] || context.stepDateMap.main;
                    const targetDate = nextDate;
                    const diff = step.offsetUnit === "工作天"
                      ? getWorkingDayDifference(anchorDate, targetDate)
                      : Math.round((createLocalDate(targetDate) - createLocalDate(anchorDate)) / (1000 * 60 * 60 * 24));
                    return {
                      ...nextStep,
                      offsetDirection: diff >= 0 ? "延後" : "提前",
                      offsetValue: Math.abs(diff)
                    };
                  });
                  const updatedRule = {
                    ...rule,
                    category: nextCategory,
                    steps: nextSteps
                  };
                  if (String(state.editing.sourceProcessStepId) === "main") {
                    updatedRule.monthlyDay = Number(nextDate.slice(8, 10)) || rule.monthlyDay;
                    updatedRule.startDate = nextDate;
                  }
                  return updatedRule;
                });
              } else {
                state.events = [{
                  ...nextEvent,
                  sourceProcessRuleId: state.editing.sourceProcessRuleId,
                  sourceProcessStepId: state.editing.sourceProcessStepId
                }, ...state.events];
                state.processRules = state.processRules.map((rule) => (
                  String(rule.id) === String(state.editing.sourceProcessRuleId)
                    ? {
                        ...rule,
                        skipOccurrences: [
                          ...new Set([...(rule.skipOccurrences || []), buildProcessSkipKey(state.editing.sourceProcessStepId, state.editing.originalDate)])
                        ]
                      }
                    : rule
                ));
              }
            } else {
              state.events = [nextEvent, ...state.events];
            }

            if (isEditingTodo) {
              state.todos = state.todos.filter((item) => String(item.id) !== String(state.editing.id));
            }
          } else {
            const nextReminderSelect = document.getElementById("modalReminder").value;
            const nextReminder = (nextReminderSelect === "自訂時間" || isCustomReminderValue(nextReminderSelect, nextType))
              ? getCustomReminderLiteral(
                nextType,
                document.getElementById("modalCustomReminderTime").value
                || getReminderCustomTime(nextReminderSelect)
                || "18:00"
              )
              : nextReminderSelect;
            const nextDueDate = normalizeDateInputValue(document.getElementById("modalTodoDueDate").value);
            if (nextReminder !== "不提醒" && !nextDueDate) {
              window.alert("待辦若要提醒，請先設定截止日。");
              return;
            }
            const nextTodo = {
              id: isEditingTodo ? state.editing.id : generateId(),
              title: nextTitle,
              dueDate: nextDueDate,
              createdDate: isEditingTodo
                ? (state.todos.find((item) => String(item.id) === String(state.editing.id))?.createdDate
                  || state.completedTodos.find((item) => String(item.id) === String(state.editing.id))?.createdDate
                  || getCurrentIsoDate())
                : getCurrentIsoDate(),
              category: nextCategory,
              priority: nextPriority,
              reminder: nextReminder,
              location: nextLocation,
              notes: nextNotes
            };
            captureUndoState();

            if (isEditingTodo) {
              state.todos = state.todos.map((item) => (String(item.id) === String(state.editing.id) ? nextTodo : item));
            } else {
              state.todos = [nextTodo, ...state.todos];
            }

            if (isEditingEvent) {
              state.events = state.events.filter((item) => String(item.id) !== String(state.editing.id));
            }
          }

          const overlay = returnToOverlay;
          returnToOverlay = null;
          closeModal();
          render();
          reopenOverlay(overlay);
        });

        syncCustomReminderField();
        document.getElementById("modalTitle").focus();
      }

      function renderHeader() {
        elements.selectedDateEyebrow.textContent = formatDateEyebrow(state.selectedDate);
        const liveToday = state.currentDayMarker || getCurrentIsoDate();
        elements.selectedDateTitle.textContent = state.selectedDate === liveToday ? "今天總覽" : `${formatDateLabel(state.selectedDate)} 總覽`;
        elements.summaryTitle.textContent = state.selectedDate === liveToday ? "今天的重點" : `${formatDateLabel(state.selectedDate)} 的重點`;
        elements.timelineTitle.textContent = `${formatDateLabel(state.selectedDate)} 的行程`;
        elements.todoTitle.textContent = "待辦事項區";
        elements.weekRangeTitle.textContent = formatWeekRangeTitle(state.weekStart);
      }

      function renderWeekOverview() {
        const dayLabels = ["日", "一", "二", "三", "四", "五", "六"];
        const cards = [];
        const previousWeekLastDay = addDays(state.weekStart, -1);
        const nextWeekFirstDay = addDays(state.weekStart, 7);

        function buildEdgeCard(isoDate, sideClass = "") {
          const count = countItemsForDate(isoDate);
          const items = getEventsForDate(isoDate);
          return `
            <p>${dayLabels[createLocalDate(isoDate).getDay()]}</p>
            <strong>${formatDateShort(isoDate)}</strong>
            <span>${count} 項</span>
            ${buildCategoryMarkerDots(items, 3)}
          `;
        }

        for (let offset = 0; offset < 7; offset += 1) {
          const iso = addDays(state.weekStart, offset);
          const count = countItemsForDate(iso);
          const tone = getWeekTone(count);
          const selectedClass = iso === state.selectedDate ? "selected" : "";
          const holidayClass = isHolidayDate(iso) ? "is-holiday" : "";
          const holidayName = getHolidayNameForDate(iso);
          const liveToday = state.currentDayMarker || getCurrentIsoDate();
          const todayClass = iso === liveToday ? "is-today" : "";
          const pastClass = iso < liveToday ? "is-past" : "";
          const items = getEventsForDate(iso);

          cards.push(`
            <article class="day-card ${tone.className} ${selectedClass} ${holidayClass} ${todayClass} ${pastClass}" data-week-date="${iso}" title="${tone.reason}">
              <p>${dayLabels[offset]}</p>
              <strong>${formatDateShort(iso)}</strong>
              ${holidayName ? `<small class="holiday-note">${escapeHtml(holidayName)}</small>` : ""}
              <span>${count} 項</span>
              ${buildCategoryMarkerDots(items, 4)}
            </article>
          `);
        }

        elements.weekGrid.innerHTML = cards.join("");
        elements.prevWeekEdge.classList.toggle("is-holiday", isHolidayDate(previousWeekLastDay));
        elements.nextWeekEdge.classList.toggle("is-holiday", isHolidayDate(nextWeekFirstDay));
        elements.prevWeekEdge.innerHTML = buildEdgeCard(previousWeekLastDay);
        elements.nextWeekEdge.innerHTML = buildEdgeCard(nextWeekFirstDay);
      }

      function renderEvents() {
        const sortedByTime = getEventsForDate(state.selectedDate);
        const upcomingEvents = sortedByTime.filter((event) => !isPastEvent(event));
        const pastEvents = sortedByTime.filter((event) => isPastEvent(event));
        const selectedEvents = [...upcomingEvents, ...pastEvents];
        const holidayName = getHolidayNameForDate(state.selectedDate);
        const holidayMarkup = holidayName
          ? `
            <div class="holiday-banner">
              <p class="card-label">假日名稱</p>
              <strong>${escapeHtml(holidayName)}</strong>
            </div>
          `
          : "";

        if (selectedEvents.length === 0) {
          elements.eventList.innerHTML = `${holidayMarkup}<div class="helper">這一天還沒有排入行程。</div>`;
          elements.nextEventTime.textContent = "這一天沒有行程";
          elements.nextEventTitle.textContent = "可以把待辦轉成行程，或直接新增行程。";
          return selectedEvents;
        }

        elements.eventList.innerHTML = `${holidayMarkup}${selectedEvents.map((event) => `
          <article class="timeline-item clickable-row ${isPastEvent(event) ? "is-past" : ""}" data-kind="event" data-id="${event.id}">
            <div>
              <p class="timeline-time">${formatEventTime(event, state.selectedDate)}</p>
              <h4>${event.title}</h4>
              ${buildEventMetaParts(event).length > 0 ? `<p class="subtle-meta">${buildEventMetaParts(event).join(" · ")}</p>` : ""}
            </div>
            <div class="meta-row">
              <span class="${getPriorityClass(event.priority)}">${event.priority}</span>
              <span class="category-badge" ${getCategoryBadgeStyle(event.category)}>${event.category}</span>
              ${IS_MOBILE_VIEW ? '<button type="button" class="ghost-button" data-mobile-actions aria-label="行程操作">⋯</button>' : ''}
            </div>
          </article>
        `).join("")}`;

        const nextEvent = upcomingEvents[0];
        elements.nextEventTime.textContent = nextEvent ? formatEventTime(nextEvent) : "今天後續沒有行程";
        elements.nextEventTitle.textContent = nextEvent ? nextEvent.title : "今天剩下的行程都已經結束。";
        return selectedEvents;
      }

      function renderTodos() {
        const todayDate = getCurrentIsoDate();
        const activeSelectedDate = state.selectedDate || todayDate;
        const activeMarkup = state.todos.length === 0
          ? `<div class="helper">目前沒有未完成待辦。</div>`
          : state.todos.map((todo) => `
              <article class="todo-item clickable-row" data-kind="todo" data-id="${todo.id}">
                <div class="meta-row">
                  <input data-id="${todo.id}" data-type="todo-complete" type="checkbox" />
                  <span>
                    <strong>${todo.title}</strong>
                    <div class="subtle-meta">${todo.category}${todo.dueDate ? ` · 截止 ${todo.dueDate}` : " · 無截止日"}</div>
                  </span>
                </div>
                <span class="${getPriorityClass(todo.priority)}">${todo.priority}</span>
                ${IS_MOBILE_VIEW ? '<button type="button" class="ghost-button" data-mobile-actions aria-label="待辦操作">⋯</button>' : ''}
              </article>
              `).join("");

        const completedForSelectedDate = state.completedTodos.filter((todo) => {
          const completedDate = todo?.completedAt
            ? (() => {
                const parsed = new Date(todo.completedAt);
                return Number.isNaN(parsed.getTime()) ? "" : toLocalIsoDate(parsed);
              })()
            : "";
          return (completedDate || normalizeDateInputValue(todo.completedDate)) === activeSelectedDate;
        });
        const completedSectionTitle = activeSelectedDate === todayDate
          ? (completedForSelectedDate.length > 0 ? "今天已完成" : "")
          : (completedForSelectedDate.length > 0 ? "當日已完成" : "");
        const completedItems = completedForSelectedDate;
        const completedMarkup = completedItems.length === 0
          ? ""
          : `
              <section class="completed-section">
                <p class="card-label">${completedSectionTitle}</p>
                ${completedItems.map((todo) => `
                  <article class="todo-item completed clickable-row" data-kind="completed-todo" data-id="${todo.id}">
                    <div class="meta-row">
                      <input data-id="${todo.id}" data-type="todo-restore" type="checkbox" />
                      <span>
                        <strong>${todo.title}</strong>
                      <div class="subtle-meta">${todo.category} · 已完成${todo.completedDate ? ` · ${formatCompletedLabel(todo)}` : ""}</div>
                    </span>
                  </div>
                  <span class="${getPriorityClass(todo.priority)}">${todo.priority}</span>
                </article>
              `).join("")}
            </section>
          `;

        elements.todoList.innerHTML = `${activeMarkup}${completedMarkup}`;
      }

      function renderStats(selectedEvents) {
        const currentToday = state.currentDayMarker || getCurrentIsoDate();
        const overdueCount = state.todos.filter((item) => item.dueDate && item.dueDate < currentToday).length;
        const highPriorityCount =
          selectedEvents.filter((item) => item.priority === "高").length +
          state.todos.filter((item) => item.priority === "高").length;

        elements.eventCount.textContent = String(selectedEvents.length);
        elements.todoCount.textContent = String(state.todos.length);
        elements.overdueCount.textContent = String(overdueCount);
        elements.highPriorityCount.textContent = String(highPriorityCount);
      }

      function completeTodo(id) {
        const todo = state.todos.find((item) => String(item.id) === String(id));
        if (!todo) return;
        captureUndoState();
        state.todos = state.todos.filter((item) => String(item.id) !== String(id));
        state.completedTodos = state.completedTodos.filter((item) => String(item.id) !== String(id));
        const now = new Date();
        const completedDate = toLocalIsoDate(now);
        state.completedTodos.unshift({
          ...todo,
          completedDate,
          completedAt: `${completedDate}T${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`
        });
      }

      function restoreTodo(id) {
        const todo = state.completedTodos.find((item) => String(item.id) === String(id));
        if (!todo) return;
        captureUndoState();
        state.completedTodos = state.completedTodos.filter((item) => String(item.id) !== String(id));
